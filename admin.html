<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#211F1C">
<title>Admin — Savor &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ bg:'var(--bg)',surface:'var(--surface)',ink:'var(--text)',muted:'var(--text-muted)' }, fontFamily:{ sans:['DM Sans','system-ui','sans-serif'], serif:['Fraunces','Georgia','serif'] } } } };</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
(function(){
  const S = window.Savor;
  const { $, esc, icon, peso, toast, setHtml, statusPill, paymentPill, orderTotal, hasMeta, orderMetaText,
          tableTag, tableLine, itemCount, readyCount, unreadyCount, servedCount, itemSummary, allNotes,
          kitchenProgress, servedProgress, emptyState, fmtTime, fmtDateTime, CATEGORIES, SEED_MENU,
          cloneSeedMenu, artClass, menuHero } = S;

  let filter = 'All';
  function filteredMenu(){ return S.state.menu.filter(m => filter === 'All' || m.category === filter); }
  function state(){ return { filter }; }
  function setFilter(c){ filter = c; render(); }

  function startApp(session){
    S.session = session || { id: 'admin', name: 'Owner', username: 'admin', role: 'Admin' };
    S.navBadge = function(key){
      if(key === 'orders'){
        const n = S.state.orders.filter(o => o.status === 'PENDING').length;
        if(n > 0) return `<span class="nav-badge">${n}</span>`;
      }
      return '';
    };
    S.onRender = render;
    S.onDataChanged = function(){};
    S.boot({ role: 'admin', defaultScreen: 'dashboard', render: render });
  }

  function viewDashboard(){
    const pending = S.state.orders.filter(o => o.status === 'PENDING');
    const cooking = S.state.orders.filter(o => o.status === 'PREPARING');
    const ready = S.state.orders.filter(o => o.status === 'READY');
    const done = S.state.orders.filter(o => o.status === 'COMPLETED');
    const paid = S.state.orders.filter(o => o.payment === 'PAID');
    const todayStr = new Date().toDateString();
    const todayPaid = paid.filter(o => o.paidAt && new Date(o.paidAt).toDateString() === todayStr);
    const todayRevenue = todayPaid.reduce((s, o) => s + orderTotal(o), 0);
    const allRevenue = paid.reduce((s, o) => s + orderTotal(o), 0);
    const awaiting = S.state.orders.filter(o => o.status === 'COMPLETED' && o.payment !== 'PAID');
    const awaitingTotal = awaiting.reduce((s, o) => s + orderTotal(o), 0);
    const popular = (() => {
      const tally = {};
      S.state.orders.forEach(o => o.items.forEach(i => { tally[i.name] = (tally[i.name] || 0) + i.qty; }));
      return Object.entries(tally).sort((a,b) => b[1] - a[1]).slice(0, 3);
    })();
    const kpis = [
      ['Orders today', S.state.orders.length, 'shopping-bag', 'text'],
      ['Pending', pending.length, 'inbox', 'info'],
      ['Cooking', cooking.length, 'flame', 'warn'],
      ['Ready', ready.length, 'bell', 'success'],
      ['Served', done.length, 'circle-check-big', 'muted']
    ];
    return `
    <div class="flex flex-wrap justify-between items-end gap-4 mb-6">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">Welcome back.</h2><p class="text-muted mt-1 text-sm">${S.state.orders.length ? 'Here is how service is moving today.' : 'Waiting for the first order from the floor.'}</p></div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="btn btn-ghost">${icon('arrow-left','w-4 h-4')} Back to roles</a>
        <button class="btn btn-primary" onclick="Savor.navigate('orders')">${icon('clipboard-list','w-4 h-4')} View orders</button>
      </div>
    </div>
    <div class="grid sm:grid-cols-2 xl:grid-cols-5 gap-4 mb-5">
      ${kpis.map(([label, value, ic, tone]) => `<article class="card soft p-5"><div class="flex justify-between items-start"><span class="text-sm text-muted">${label}</span><span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--${tone === 'text' ? 'primary-soft' : tone === 'info' ? 'info-soft' : tone === 'warn' ? 'warn-soft' : tone === 'success' ? 'success-soft' : 'surface-2'});color:var(--${tone === 'text' ? 'primary' : tone === 'info' ? 'info' : tone === 'warn' ? 'warn' : tone === 'success' ? 'success' : 'text-muted'})">${icon(ic,'w-4 h-4')}</span></div><strong class="block text-3xl mt-4">${value}</strong><small class="text-muted">Live today</small></article>`).join('')}
    </div>
    <div class="grid sm:grid-cols-3 gap-4 mb-5">
      <article class="card soft p-5"><div class="flex justify-between items-start"><span class="text-sm text-muted">Revenue today</span><span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--success-soft);color:var(--success)">${icon('banknote','w-4 h-4')}</span></div><strong class="block text-3xl mt-4">${peso(todayRevenue)}</strong><small class="text-muted">${todayPaid.length} paid order${todayPaid.length === 1 ? '' : 's'}</small></article>
      <article class="card soft p-5"><div class="flex justify-between items-start"><span class="text-sm text-muted">Awaiting payment</span><span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--warn-soft);color:var(--warn)">${icon('clock','w-4 h-4')}</span></div><strong class="block text-3xl mt-4">${peso(awaitingTotal)}</strong><small class="text-muted">${awaiting.length} served, not paid</small></article>
      <article class="card soft p-5"><div class="flex justify-between items-start"><span class="text-sm text-muted">All-time revenue</span><span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--primary-soft);color:var(--primary)">${icon('trending-up','w-4 h-4')}</span></div><strong class="block text-3xl mt-4">${peso(allRevenue)}</strong><small class="text-muted">${paid.length} paid order${paid.length === 1 ? '' : 's'}</small></article>
    </div>
    <div class="grid xl:grid-cols-3 gap-5">
      <section class="card soft p-5 xl:col-span-2"><h3 class="font-bold">Order status</h3><div class="mt-4 space-y-3 text-sm">
        <div class="flex justify-between items-center"><span class="pill pill-pending">Pending</span><strong>${pending.length}</strong></div>
        <div class="flex justify-between items-center"><span class="pill pill-preparing">Cooking</span><strong>${cooking.length}</strong></div>
        <div class="flex justify-between items-center"><span class="pill pill-ready">Ready to serve</span><strong>${ready.length}</strong></div>
        <div class="flex justify-between items-center"><span class="pill pill-completed">Served</span><strong>${done.length}</strong></div>
      </div><button class="mt-6 text-sm font-bold" style="color:var(--primary)" onclick="Savor.navigate('orders')">Review all orders →</button></section>
      <section class="card soft p-5"><h3 class="font-bold">Most ordered today</h3>${popular.length ? popular.map(([name, qty], i) => `<div class="flex items-center gap-3 mt-4"><span class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold" style="background:var(--primary-soft);color:var(--primary)">0${i + 1}</span><span class="flex-1 text-sm">${esc(name)}</span><strong class="text-sm">${qty}</strong></div>`).join('') : '<p class="text-sm text-muted mt-4">No orders yet.</p>'}</section>
    </div>
    <section class="card soft p-5 mt-5"><div class="flex justify-between items-center"><h3 class="font-bold">Recent orders</h3><button class="text-sm font-semibold" style="color:var(--primary)" onclick="Savor.navigate('orders')">See all</button></div><div class="mt-2">${S.state.orders.slice(0, 6).map(o => `<div class="flex justify-between items-center py-3 border-b last:border-0" style="border-color:var(--border)"><div class="min-w-0"><strong class="text-sm">${esc(o.code)}</strong>${hasMeta(o) ? `<small class="block" style="color:var(--warn);font-weight:600">${esc(orderMetaText(o))}</small>` : ''}<small class="block text-muted">${fmtTime(o.createdAt)} · ${peso(orderTotal(o))}</small></div><div class="flex items-center gap-2">${statusPill(o.status)}${paymentPill(o)}</div></div>`).join('') || '<p class="text-sm text-muted py-4">No orders yet.</p>'}</div></section>`;
  }

  function viewMenu(){
    const counts = ['Appetizer','Main Dish','Dessert','Drinks'].map(c => `${S.state.menu.filter(m => m.category === c).length} ${c.toLowerCase()}${c.endsWith('s') ? '' : 's'}`).join(' · ');
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">Menu</h2><p class="text-muted text-sm mt-1">${S.state.menu.length} items · ${counts}</p></div>
      <button class="btn btn-primary" onclick="AD.openMenuItemModal('')">${icon('plus','w-4 h-4')} Add item</button>
    </div>
    <div class="flex gap-2 mt-4 overflow-x-auto pb-1">
      ${CATEGORIES.map(c => `<button class="pill ${filter === c ? 'pill-preparing' : 'pill-completed'}" onclick="AD.setFilter('${c}')">${c}</button>`).join('')}
    </div>
    <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-5">
      ${filteredMenu().map(item => `<article class="card soft overflow-hidden flex flex-col">${menuHero(item, 'h-32', 'text-5xl')}<div class="p-4 flex flex-col flex-1"><div class="flex justify-between gap-2 items-start"><div class="min-w-0"><h3 class="font-bold truncate">${esc(item.name)}</h3><p class="text-xs text-muted mt-0.5">${esc(item.category)}</p></div><span class="pill ${item.available ? 'pill-ready' : 'pill-completed'}">${item.available ? 'On' : 'Hidden'}</span></div><p class="text-sm text-muted mt-2 line-clamp-2">${esc(item.description || '')}</p><div class="flex justify-between items-center mt-3 pt-3 border-t" style="border-color:var(--border)"><strong class="text-base" style="color:var(--primary)">${peso(item.price)}</strong><div class="flex gap-1"><button class="btn btn-ghost !py-1.5 !px-2" onclick="AD.openMenuItemModal('${item.id}')">${icon('pencil','w-3.5 h-3.5')}</button><button class="btn btn-ghost !py-1.5 !px-2" style="color:var(--danger)" onclick="AD.deleteMenuItemConfirm('${item.id}')">${icon('trash-2','w-3.5 h-3.5')}</button></div></div></div></article>`).join('') || `<div class="col-span-full card soft p-10 text-center text-muted">No items. Tap Add item.</div>`}
    </div>`;
  }

  function viewOrders(){
    const list = S.state.orders.slice(0, 60);
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">All orders</h2><p class="text-muted text-sm mt-1">Every order today.</p></div>
      <button class="btn btn-ghost" onclick="Savor.refreshNow()">${icon('refresh-cw','w-4 h-4')} Refresh</button>
    </div>
    ${list.length ? `<div class="grid gap-4 mt-5">${list.map(o => `<article class="card soft p-5 flex flex-wrap justify-between gap-4"><div class="min-w-0 flex-1"><div class="flex items-center gap-3 flex-wrap"><h3 class="font-bold text-lg">${esc(o.code)}</h3>${statusPill(o.status)}${paymentPill(o)}</div>${tableLine(o)}<p class="mt-2 text-xs text-muted">Sent ${fmtTime(o.createdAt)}</p><p class="text-sm text-muted mt-2">${esc(itemSummary(o))}</p><p class="text-sm font-semibold mt-1">${peso(orderTotal(o))}</p>${o.status === 'READY' ? servedProgress(o) : ''}${o.staff ? `<p class="text-xs text-muted mt-1">Handled by ${esc(o.staff)}</p>` : ''}</div></article>`).join('')}</div>` : `<div class="mt-6">${emptyState('clipboard-list','No orders yet','Orders placed by the waiter will show up here.')}</div>`}`;
  }

  function viewAccounts(){
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">Staff</h2><p class="text-muted text-sm mt-1">${S.state.accounts.length} account${S.state.accounts.length === 1 ? '' : 's'}.</p></div>
      <button class="btn btn-primary" onclick="AD.openAccountModal()">${icon('plus','w-4 h-4')} Add staff</button>
    </div>
    ${S.state.accounts.length ? `<div class="grid gap-3 mt-5">${S.state.accounts.map(a => `<article class="card soft p-4 flex justify-between items-center gap-3"><div class="flex items-center gap-3 min-w-0"><span class="w-10 h-10 rounded-full flex items-center justify-center text-xs font-bold flex-none" style="background:var(--text);color:var(--bg)">${esc((a.name||'?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase())}</span><div class="min-w-0"><strong class="block text-sm truncate">${esc(a.name)}</strong><small class="text-muted">${esc(a.role)} · <span class="font-mono text-xs font-semibold" style="color:var(--primary)">@${esc(a.username || '—')}</span></small></div></div><button class="btn btn-ghost !p-2" style="color:var(--danger)" onclick="AD.removeAccount('${a.id}')">${icon('trash-2','w-4 h-4')}</button></article>`).join('')}</div>` : `<div class="mt-6">${emptyState('users','No staff added','Add your team for the record.')}</div>`}`;
  }

  function viewSettings(){
    const connected = !!S.CONFIG.API_URL;
    return `
    <div class="max-w-5xl">
      <h2 class="font-serif text-2xl md:text-3xl font-bold">Settings</h2>
      <p class="text-muted text-sm mt-1">Configure your Cloud SQL database and staff preferences.</p>
      <div class="grid xl:grid-cols-2 gap-5 mt-6">
        <section class="card soft p-5"><h3 class="font-bold">Restaurant preferences</h3><div class="mt-2"><div class="flex items-center justify-between gap-4 py-4 border-t" style="border-color:var(--border)"><div><span class="font-semibold text-sm block">Theme</span></div><button class="btn btn-ghost !py-2" onclick="Savor.toggleTheme()">Toggle</button></div><div class="flex items-center justify-between gap-4 py-4 border-t" style="border-color:var(--border)"><div><span class="font-semibold text-sm block">Order sound</span></div><button class="toggle ${S.state.sound ? 'on' : ''}" onclick="Savor.toggleSound()"><span></span></button></div></div></section>
        <section class="card soft p-5">
          <div class="flex items-center justify-between gap-3">
            <h3 class="font-bold">Cloud SQL Database</h3>
            <span class="pill ${(S.state.net === 'sheets' || S.state.net === 'sql') ? 'pill-live' : S.state.net === 'offline' ? 'pill-preparing' : 'pill-new'}">
              ${(S.state.net === 'sheets' || S.state.net === 'sql') ? 'ACTIVE &amp; SYNCED' : S.state.net === 'offline' ? 'UNREACHABLE' : 'LOCAL DEMO'}
            </span>
          </div>
          <p class="text-sm text-muted mt-2">Powered by serverless PostgreSQL API (<code>/api/pos</code>). Data synchronizes across all staff phones, tablets, and terminals in real time.</p>
          <div class="flex items-center gap-2 mt-4 pt-3 border-t" style="border-color:var(--border)">
            <button class="btn btn-primary" onclick="Savor.refreshNow()">${icon('refresh-cw','w-4 h-4')} Sync Database</button>
            <button class="btn btn-ghost" onclick="Savor.openConnectModal()">${icon('database','w-4 h-4')} Database Details</button>
          </div>
        </section>
        <section class="card soft p-5 xl:col-span-2">
          <h3 class="font-bold">🔗 Share with staff devices</h3>
          <p class="text-sm text-muted mt-2">Staff can open role links on phones, tablets, or computers with multi-user real-time sync.</p>
          <div class="rounded-xl p-3 mt-4 text-xs" style="background:${connected ? 'var(--success-soft)' : 'var(--warn-soft)'};color:${connected ? 'var(--success)' : 'var(--warn)'}">
            ${connected ? '<strong>Ready to share.</strong> Staff open their role page on any device with instant live SQL sync.' : '<strong>Configure or connect database first.</strong> Check Database Details above, save, then share.'}
          </div>
          <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-2 mt-4">
            ${['waiter','kitchen','cashier','semi-admin','admin'].map(r => `<button class="btn btn-ghost justify-between" ${connected ? `onclick="AD.copyRoleLink('${r}')"` : 'disabled style="opacity:.5;cursor:not-allowed"'}><span class="flex items-center gap-2">${icon('link','w-4 h-4')} Copy ${r.replace('-',' ')} link</span>${icon('arrow-right','w-3 h-3')}</button>`).join('')}
          </div>
        </section>
        <section class="card soft p-5 xl:col-span-2">
          <h3 class="font-bold">Reset</h3>
          <p class="text-sm text-muted mt-2">Clear local orders, staff, and menu edits.</p>
          <button class="btn btn-danger mt-4" onclick="AD.confirmReset()">Reset workspace</button>
        </section>
      </div>
    </div>`;
  }

  function render(){
    const map = { dashboard: viewDashboard, menu: viewMenu, orders: viewOrders, accounts: viewAccounts, settings: viewSettings };
    const fn = map[S.screen] || viewDashboard;
    const titles = { dashboard:'Dashboard', menu:'Menu', orders:'Orders', accounts:'Staff', settings:'Settings' };
    document.getElementById('screen-eyebrow').textContent = 'SAVOR & CO.';
    document.getElementById('screen-title').textContent = titles[S.screen] || 'Dashboard';
    setHtml(document.getElementById('main'), fn());
    document.getElementById('main').firstElementChild?.classList.add('screen-enter');
    S._renderNav();
    S.setNet(S.state.net);
    const pending = S.state.orders.filter(o => o.status === 'PENDING').length;
    document.title = pending > 0 ? `(${pending}) Admin — Savor` : 'Admin — Savor & Co.';
  }

  function photoFieldHtml(imageUrl){
    if(imageUrl){
      return `
      <div class="relative rounded-2xl overflow-hidden border group" style="border-color:var(--border)">
        <img src="${esc(imageUrl)}" alt="Dish photo" class="w-full h-44 object-cover block">
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent flex items-end justify-between p-3.5">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-white px-2.5 py-1 rounded-lg backdrop-blur-md bg-black/40">
            ${icon('check','w-3.5 h-3.5 text-emerald-400')}
            <span>Photo attached</span>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" class="btn btn-ghost !py-1.5 !px-3 !text-xs !bg-white/95 !text-neutral-900 hover:!bg-white shadow-sm flex items-center gap-1.5 font-semibold" onclick="document.getElementById('m-photo-file').click()">
              ${icon('image-plus','w-3.5 h-3.5')}
              <span>Change</span>
            </button>
            <button type="button" class="btn btn-ghost !py-1.5 !px-3 !text-xs !bg-red-500/90 !text-white hover:!bg-red-600 shadow-sm flex items-center gap-1.5 font-semibold" onclick="AD.removePhoto()">
              ${icon('trash-2','w-3.5 h-3.5')}
              <span>Remove</span>
            </button>
          </div>
        </div>
      </div>`;
    }
    return `
    <div id="m-photo-dropzone" class="photo-dropzone p-6 text-center cursor-pointer" onclick="document.getElementById('m-photo-file').click()" ondragover="AD.onPhotoDragOver(event)" ondragleave="AD.onPhotoDragLeave(event)" ondrop="AD.onPhotoDrop(event)">
      <div class="w-12 h-12 mx-auto rounded-2xl flex items-center justify-center mb-2.5" style="background:var(--primary-soft);color:var(--primary)">
        ${icon('camera','w-6 h-6')}
      </div>
      <p class="font-bold text-sm">Choose photo from phone or PC</p>
      <p class="text-xs text-muted mt-1">Tap to select from photo gallery, snap with camera, or browse PC files</p>
      <div class="flex items-center justify-center gap-3 mt-3 text-[11px] text-muted">
        <span class="flex items-center gap-1">${icon('smartphone','w-3.5 h-3.5')} Mobile camera / gallery</span>
        <span>·</span>
        <span class="flex items-center gap-1">${icon('monitor','w-3.5 h-3.5')} PC files / Drag &amp; drop</span>
      </div>
    </div>`;
  }

  function onPhotoDragOver(e){
    e.preventDefault(); e.stopPropagation();
    const el = document.getElementById('m-photo-dropzone');
    if(el) el.classList.add('dragover');
  }
  function onPhotoDragLeave(e){
    e.preventDefault(); e.stopPropagation();
    const el = document.getElementById('m-photo-dropzone');
    if(el) el.classList.remove('dragover');
  }
  function onPhotoDrop(e){
    e.preventDefault(); e.stopPropagation();
    const el = document.getElementById('m-photo-dropzone');
    if(el) el.classList.remove('dragover');
    const file = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if(file) handlePhotoFileDirect(file);
  }
  function handlePhotoFile(input){
    const file = input && input.files ? input.files[0] : null;
    if(file) handlePhotoFileDirect(file);
  }
  async function handlePhotoFileDirect(file){
    if(!file) return;
    if(file.type && !file.type.startsWith('image/')){
      S.toast('Please select an image file (JPG, PNG, WebP).');
      return;
    }
    const container = document.getElementById('m-photo-container');
    if(container){
      container.innerHTML = `
      <div class="rounded-2xl border p-8 text-center flex flex-col items-center justify-center gap-2" style="border-color:var(--border);background:var(--surface-2)">
        <div class="w-8 h-8 rounded-full border-2 border-t-transparent animate-spin" style="border-color:var(--primary);border-top-color:transparent"></div>
        <p class="text-xs font-bold mt-2" style="color:var(--primary)">Optimizing photo...</p>
        <p class="text-[11px] text-muted">Scaling & compressing for phone & PC sync</p>
      </div>`;
    }
    try {
      const dataUrl = await S.processImageFile(file);
      const hidden = document.getElementById('m-image');
      if(hidden) hidden.value = dataUrl;
      const urlInput = document.getElementById('m-image-url');
      if(urlInput) urlInput.value = '';
      updatePhotoUI(dataUrl);
      S.toast('Photo attached ✓');
    } catch(err){
      console.error(err);
      S.toast('Failed to process image: ' + (err.message || 'Unknown error'));
      const hidden = document.getElementById('m-image');
      updatePhotoUI(hidden ? hidden.value : '');
    }
  }
  function removePhoto(){
    const hidden = document.getElementById('m-image');
    if(hidden) hidden.value = '';
    const fileInput = document.getElementById('m-photo-file');
    if(fileInput) fileInput.value = '';
    const urlInput = document.getElementById('m-image-url');
    if(urlInput) urlInput.value = '';
    updatePhotoUI('');
    S.toast('Photo removed');
  }
  function updatePhotoUI(imageUrl){
    const container = document.getElementById('m-photo-container');
    if(container){
      container.innerHTML = photoFieldHtml(imageUrl);
      if(window.lucide) lucide.createIcons();
    }
    const toggleText = document.getElementById('m-toggle-url-text');
    if(toggleText){
      toggleText.textContent = (imageUrl && !imageUrl.startsWith('data:')) ? 'Edit image URL' : 'Or paste image URL instead';
    }
  }
  function toggleUrlInput(){
    const wrap = document.getElementById('m-url-wrap');
    if(wrap){
      wrap.classList.toggle('hidden');
      if(!wrap.classList.contains('hidden')){
        const input = document.getElementById('m-image-url');
        if(input) input.focus();
      }
    }
  }
  function handleUrlInput(val){
    const trimmed = String(val || '').trim();
    const hidden = document.getElementById('m-image');
    if(hidden) hidden.value = trimmed;
    updatePhotoUI(trimmed);
  }

  function openMenuItemModal(id){
    const editing = id ? S.state.menu.find(m => m.id === id) : null;
    const item = editing || { name:'', category:'Main Dish', description:'', ingredients:'', price:0, emoji:'', image:'', available:true };
    S.openModal(`
    <div class="p-6">
      <div class="flex justify-between items-start">
        <div><p class="text-xs font-bold uppercase tracking-[.14em]" style="color:var(--primary)">${editing ? 'Edit item' : 'New menu item'}</p><h2 class="font-serif text-2xl font-bold mt-1">${editing ? esc(editing.name) : 'Add to menu'}</h2></div>
        <button class="btn btn-ghost !p-2" onclick="Savor.closeModal()">${icon('x','w-4 h-4')}</button>
      </div>
      <form class="space-y-4 mt-5" onsubmit="event.preventDefault();AD.saveMenuItem('${id || ''}')">
        <div>
          <label class="block text-sm font-semibold mb-2">Photo</label>
          <input type="file" id="m-photo-file" accept="image/*" class="hidden" onchange="AD.handlePhotoFile(this)">
          <input type="hidden" id="m-image" value="${esc(item.image || '')}">
          <div id="m-photo-container">
            ${photoFieldHtml(item.image || '')}
          </div>
          <div class="flex items-center justify-between text-xs mt-2 px-0.5">
            <button type="button" class="text-muted hover:underline flex items-center gap-1 cursor-pointer" onclick="AD.toggleUrlInput()">
              ${icon('link','w-3 h-3')}
              <span id="m-toggle-url-text">${item.image && !item.image.startsWith('data:') ? 'Edit image URL' : 'Or paste image URL instead'}</span>
            </button>
            <span class="text-muted text-[11px]">Auto-optimizes for mobile &amp; PC</span>
          </div>
          <div id="m-url-wrap" class="${item.image && !item.image.startsWith('data:') ? '' : 'hidden'} mt-2">
            <input id="m-image-url" class="field !text-xs !py-2" placeholder="https://example.com/dish.jpg" value="${item.image && !item.image.startsWith('data:') ? esc(item.image) : ''}" oninput="AD.handleUrlInput(this.value)">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <label class="block text-sm font-semibold">Name<input id="m-name" required class="field mt-2" value="${esc(item.name)}"></label>
          <label class="block text-sm font-semibold">Category<select id="m-category" class="field mt-2">${['Appetizer','Main Dish','Dessert','Drinks'].map(c => `<option ${item.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
        </div>
        <label class="block text-sm font-semibold">Ingredients<textarea id="m-ingredients" class="field mt-2" rows="2">${esc(item.ingredients || '')}</textarea></label>
        <label class="block text-sm font-semibold">Description<textarea id="m-description" class="field mt-2" rows="2">${esc(item.description || '')}</textarea></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block text-sm font-semibold">Price (₱)<input id="m-price" type="number" min="0" required class="field mt-2" value="${item.price || 0}"></label>
          <label class="block text-sm font-semibold">Emoji<input id="m-emoji" class="field mt-2" maxlength="4" value="${esc(item.emoji || '')}"></label>
        </div>
        <label class="flex items-center justify-between py-2 px-3 rounded-xl" style="background:var(--surface-2)"><span class="text-sm font-semibold">Available on the menu</span><input id="m-available" type="checkbox" ${item.available !== false ? 'checked' : ''} class="w-5 h-5"></label>
        <button class="btn btn-primary w-full">${editing ? 'Save changes' : 'Add to menu'}</button>
      </form>
    </div>`);
  }
  async function saveMenuItem(id){
    const name = document.getElementById('m-name').value.trim();
    if(!name){ S.toast('Name is required.'); return; }
    const item = {
      id: id || S.uid(), name,
      category: document.getElementById('m-category').value,
      description: document.getElementById('m-description').value.trim(),
      ingredients: document.getElementById('m-ingredients').value.trim(),
      price: Number(document.getElementById('m-price').value) || 0,
      emoji: document.getElementById('m-emoji').value.trim(),
      image: document.getElementById('m-image').value.trim(),
      available: document.getElementById('m-available').checked
    };
    await S.Data.saveMenuItem(item);
    S.closeModal(); S.toast(id ? 'Item updated ✓' : 'Item added ✓'); render();
  }
  function deleteMenuItemConfirm(id){
    const item = S.state.menu.find(m => m.id === id); if(!item) return;
    S.openModal(`<div class="p-7 text-center"><div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" style="background:var(--danger-soft);color:var(--danger)">${icon('triangle-alert','w-6 h-6')}</div><h2 class="font-serif text-2xl font-bold mt-4">Delete "${esc(item.name)}"?</h2><p class="text-sm text-muted mt-3">This menu item will be removed permanently.</p><div class="flex gap-3 mt-6"><button class="btn btn-ghost flex-1" onclick="Savor.closeModal()">Cancel</button><button class="btn btn-danger flex-1" onclick="AD.confirmDelete('${id}')">Delete</button></div></div>`);
  }
  async function confirmDelete(id){
    S.closeModal();
    await S.Data.deleteMenuItem(id);
    S.toast('Item deleted.'); render();
  }

  function openAccountModal(){
    S.openModal(`
    <div class="p-6">
      <div class="flex justify-between items-start">
        <div><p class="text-xs font-bold uppercase tracking-[.14em]" style="color:var(--primary)">Staff Credentials</p><h2 class="font-serif text-2xl font-bold mt-1">Add Staff Account</h2></div>
        <button class="btn btn-ghost !p-2" onclick="Savor.closeModal()">${icon('x','w-4 h-4')}</button>
      </div>
      <form class="space-y-3.5 mt-5" onsubmit="event.preventDefault();AD.saveAccount()">
        <label class="block text-sm font-semibold">Full name *<input id="a-name" required class="field mt-1.5" placeholder="e.g. Ana Reyes"></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block text-sm font-semibold">Username *<input id="a-username" required class="field mt-1.5" placeholder="e.g. ana123" autocomplete="off"></label>
          <label class="block text-sm font-semibold">Password *<input id="a-password" type="password" required class="field mt-1.5" placeholder="Set password" autocomplete="new-password"></label>
        </div>
        <label class="block text-sm font-semibold">Role *
          <select id="a-role" class="field mt-1.5">
            <option>Waiter</option>
            <option>Kitchen</option>
            <option>Cashier</option>
            <option>Semi Admin</option>
            <option>Admin</option>
          </select>
        </label>
        <div id="a-error" class="hidden text-xs font-semibold p-2.5 rounded-lg" style="background:var(--danger-soft);color:var(--danger)"></div>
        <div class="flex gap-2.5 pt-2">
          <button type="button" class="btn btn-ghost flex-1" onclick="Savor.closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary flex-1">Create Staff Account</button>
        </div>
      </form>
    </div>`);
  }
  async function saveAccount(){
    const name = document.getElementById('a-name').value.trim();
    const username = document.getElementById('a-username').value.trim();
    const password = document.getElementById('a-password').value.trim();
    const role = document.getElementById('a-role').value;
    const errEl = document.getElementById('a-error');
    errEl.classList.add('hidden');
    if(!name){ errEl.textContent = 'Name is required.'; errEl.classList.remove('hidden'); return; }
    if(!username){ errEl.textContent = 'Username is required.'; errEl.classList.remove('hidden'); return; }
    if(!password){ errEl.textContent = 'Password is required.'; errEl.classList.remove('hidden'); return; }
    
    // Check if username already exists
    const duplicate = S.state.accounts.find(a => a.username && a.username.toLowerCase() === username.toLowerCase());
    if(duplicate){
      errEl.textContent = `Username "@${username}" is already taken. Please choose another.`;
      errEl.classList.remove('hidden');
      return;
    }

    const account = { id: S.uid(), name, username, password, role, status: 'Active' };
    try {
      await S.Data.saveAccount(account);
      S.closeModal(); S.toast(`Staff account @${username} created (${role}) ✓`); render();
    } catch(err){
      errEl.textContent = err.message || 'Failed.';
      errEl.classList.remove('hidden');
    }
  }
  async function removeAccount(id){
    await S.Data.deleteAccount(id);
    S.toast('Staff removed.'); render();
  }

  function saveApiUrl(){
    const input = document.getElementById('api-url');
    const v = (input?.value || '').trim();
    S.saveAndTestUrl(v);
  }

  function buildRoleLink(role){
    if(!S.CONFIG.API_URL) return '';
    const base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
    return base + role + '.html?api=' + encodeURIComponent(S.CONFIG.API_URL);
  }
  function copyRoleLink(role){
    S.copyRoleLink(role);
  }

  function openSheetsGuide(){
    S.openConnectModal();
  }

  function confirmReset(){
    S.openModal(`<div class="p-7 text-center"><div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" style="background:var(--danger-soft);color:var(--danger)">${icon('triangle-alert','w-6 h-6')}</div><h2 class="font-serif text-2xl font-bold mt-4">Reset everything?</h2><p class="text-sm text-muted mt-3">Local orders, staff, and menu edits will be cleared.</p><div class="flex gap-3 mt-6"><button class="btn btn-ghost flex-1" onclick="Savor.closeModal()">Cancel</button><button class="btn btn-danger flex-1" onclick="AD.runReset()">Confirm</button></div></div>`);
  }
  async function runReset(){
    S.closeModal();
    S.Local.blank();
    S.state.orders = []; S.state.accounts = [];
    S.state.menu = S.cloneSeedMenu();
    if(S.API.enabled){
      try { await S.API.call('reset'); } catch(e){}
    }
    S.toast('Workspace cleared.'); render();
  }

  window.AD = {
    filteredMenu, state, setFilter, openMenuItemModal, saveMenuItem, deleteMenuItemConfirm, confirmDelete,
    openAccountModal, saveAccount, removeAccount, saveApiUrl, copyRoleLink, openSheetsGuide, confirmReset, runReset,
    photoFieldHtml, onPhotoDragOver, onPhotoDragLeave, onPhotoDrop, handlePhotoFile, handlePhotoFileDirect,
    removePhoto, updatePhotoUI, toggleUrlInput, handleUrlInput
  };

  /* ===== Entry — Protected by Admin Password ===== */
  const session = S.requireRole('admin');
  if(session){
    startApp(session);
  }
})();
</script>
</body>
</html>
