<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F0E0C">
  <title>Food &amp; Beverage — Restaurant CMS &amp; Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet">
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bg: 'var(--bg)', surface: 'var(--surface)', 'surface-2': 'var(--surface-2)', 'surface-3': 'var(--surface-3)', border: 'var(--border)', ink: 'var(--ink)', muted: 'var(--text-muted)', primary: 'var(--primary)' } } } };</script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="shared.js"></script>
</head>

<body class="bg-bg text-ink">
  <div id="app"></div>

  <script>
    (function () {
      const S = window.Savor;
      const session = S.requireRole('admin');
      if (!session) return;
      S.session = session;

      const { $, esc, icon, peso, toast, setHtml, statusPill, paymentPill, orderTotal, hasMeta, orderMetaText,
        tableTag, itemCount, readyCount, unreadyCount, servedCount, itemSummary, menuHero, sanitizeUsername, processImageFile, fmtTime, fmtDateTime } = S;

      let menuFilter = 'All';
      let menuSearch = '';
      let ordersFilter = 'ALL';
      let ordersSearch = '';
      let activeImageUpload = '';

      let dashDayFilter = 'TODAY';
      let dashCustomDate = S.fmtDateKey(Date.now());
      let ordersDayFilter = 'ALL';
      let ordersCustomDate = S.fmtDateKey(Date.now());
      let settingsResetDate = S.fmtDateKey(Date.now());

      function filterOrdersByDay(list, filterType, customDate) {
        if (filterType === 'ALL') return list;
        const todayKey = S.fmtDateKey(Date.now());
        const yestKey = S.fmtDateKey(Date.now() - 86400000);
        return list.filter(o => {
          const key = S.fmtDateKey(o.createdAt || o.created_at || Date.now());
          if (filterType === 'TODAY') return key === todayKey;
          if (filterType === 'YESTERDAY') return key === yestKey;
          if (filterType === 'CUSTOM') return key === customDate;
          return true;
        });
      }

      const NAV_ITEMS = [
        { key: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
        { key: 'menu', label: 'Menu CMS', icon: 'utensils' },
        { key: 'orders', label: 'Orders Log', icon: 'receipt' },
        { key: 'staff', label: 'Staff PINs', icon: 'users' },
        { key: 'settings', label: 'Settings', icon: 'settings' }
      ];

      function render() {
        const app = document.getElementById('app');
        if (!app) return;

        let mainContent = '';
        switch (S.currentScreen) {
          case 'menu': mainContent = viewMenuCMS(); break;
          case 'orders': mainContent = viewOrdersCMS(); break;
          case 'staff': mainContent = viewStaffCMS(); break;
          case 'settings': mainContent = viewSettingsCMS(); break;
          case 'dashboard':
          default: mainContent = viewDashboard(); break;
        }

        setHtml(app, `
      ${S.renderNav('Restaurant CMS Hub', S.currentScreen, NAV_ITEMS)}
      <main class="max-w-7xl mx-auto px-4 py-6">
        ${mainContent}
      </main>
    `);
      }

      /* ==================== 1. DASHBOARD ==================== */
      function viewDashboard() {
        const allOrders = S.state.orders;
        const orders = filterOrdersByDay(allOrders, dashDayFilter, dashCustomDate);

        const pending = orders.filter(o => o.status === 'PENDING');
        const cooking = orders.filter(o => o.status === 'PREPARING');
        const ready = orders.filter(o => o.status === 'READY');
        const served = orders.filter(o => o.status === 'COMPLETED');
        const paid = orders.filter(o => o.payment === 'PAID');
        const awaitingPay = orders.filter(o => o.status === 'COMPLETED' && o.payment !== 'PAID');

        const totalRevenue = paid.reduce((sum, o) => sum + orderTotal(o), 0);
        const awaitingRevenue = awaitingPay.reduce((sum, o) => sum + orderTotal(o), 0);
        const avgCheck = paid.length > 0 ? (totalRevenue / paid.length) : 0;

        const salesTally = {};
        orders.forEach(o => {
          (o.items || []).forEach(item => {
            salesTally[item.name] = (salesTally[item.name] || 0) + (Number(item.qty) || 1);
          });
        });
        const topDishes = Object.entries(salesTally).sort((a, b) => b[1] - a[1]).slice(0, 4);

        let dayFilterLabel = 'Today';
        if (dashDayFilter === 'YESTERDAY') dayFilterLabel = 'Yesterday';
        else if (dashDayFilter === 'CUSTOM') dayFilterLabel = S.fmtDate(new Date(dashCustomDate).getTime());
        else if (dashDayFilter === 'ALL') dayFilterLabel = 'All Days';

        return `
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div>
          <h2 class="font-serif text-2xl md:text-3xl font-bold tracking-tight">Executive Restaurant CMS</h2>
          <p class="text-sm text-muted mt-1">Live service monitor, staff 4-digit PIN management, and real-time cloud sync.</p>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn btn-ghost" onclick="Savor.navigate('settings')">
            ${icon('database', 'w-4 h-4 text-amber-500')} Cloud Settings
          </button>
          <button class="btn btn-primary" onclick="Savor.navigate('orders')">
            ${icon('receipt', 'w-4 h-4')} View Orders (${allOrders.length})
          </button>
        </div>
      </div>

      <div class="card p-4 mb-6 bg-surface-2/60 border border-border flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-bold uppercase text-muted flex items-center gap-1.5 mr-1">
            ${icon('calendar', 'w-4 h-4 text-amber-500')} View Day:
          </span>
          <button class="btn ${dashDayFilter === 'TODAY' ? 'btn-primary' : 'btn-ghost'} py-1.5 px-3 text-xs rounded-xl" onclick="window.setDashDayFilter('TODAY')">Today</button>
          <button class="btn ${dashDayFilter === 'YESTERDAY' ? 'btn-primary' : 'btn-ghost'} py-1.5 px-3 text-xs rounded-xl" onclick="window.setDashDayFilter('YESTERDAY')">Yesterday</button>
          <button class="btn ${dashDayFilter === 'ALL' ? 'btn-primary' : 'btn-ghost'} py-1.5 px-3 text-xs rounded-xl" onclick="window.setDashDayFilter('ALL')">All Days</button>
        </div>
        <div class="flex items-center gap-2.5">
          <label class="text-xs text-muted font-bold uppercase">Specific Date:</label>
          <input type="date" class="input py-1 px-2.5 text-xs font-mono" value="${dashCustomDate}" onchange="window.setDashCustomDate(this.value)">
          <span class="pill pill-paid text-xs font-semibold">${dayFilterLabel} · ${orders.length} orders</span>
        </div>
      </div>

      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="card p-5">
          <div class="flex justify-between items-center text-sm text-muted">
            <span>Collected Revenue</span>
            <span class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center">${icon('banknote', 'w-4 h-4')}</span>
          </div>
          <div class="text-3xl font-bold mt-3">${peso(totalRevenue)}</div>
          <div class="text-xs text-muted mt-1">${paid.length} settled tickets (${dayFilterLabel})</div>
        </div>

        <div class="card p-5">
          <div class="flex justify-between items-center text-sm text-muted">
            <span>Awaiting Payment</span>
            <span class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center">${icon('clock', 'w-4 h-4')}</span>
          </div>
          <div class="text-3xl font-bold mt-3">${peso(awaitingRevenue)}</div>
          <div class="text-xs text-muted mt-1">${awaitingPay.length} served tables unpaid</div>
        </div>

        <div class="card p-5">
          <div class="flex justify-between items-center text-sm text-muted">
            <span>Total Orders (${dayFilterLabel})</span>
            <span class="w-8 h-8 rounded-xl bg-sky-500/10 text-sky-500 flex items-center justify-center">${icon('shopping-bag', 'w-4 h-4')}</span>
          </div>
          <div class="text-3xl font-bold mt-3">${orders.length}</div>
          <div class="text-xs text-muted mt-1">Avg check: ${peso(avgCheck)}</div>
        </div>

        <div class="card p-5">
          <div class="flex justify-between items-center text-sm text-muted">
            <span>Active in Service</span>
            <span class="w-8 h-8 rounded-xl bg-orange-500/10 text-orange-500 flex items-center justify-center">${icon('flame', 'w-4 h-4')}</span>
          </div>
          <div class="text-3xl font-bold mt-3">${pending.length + cooking.length + ready.length}</div>
          <div class="text-xs text-muted mt-1">${ready.length} ready at pass</div>
        </div>
      </div>

      <div class="grid lg:grid-cols-3 gap-6 mb-6">
        <div class="card p-5 lg:col-span-2">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-base flex items-center gap-2">
              ${icon('activity', 'w-4 h-4 text-amber-500')} Floor &amp; Kitchen Flow
            </h3>
            <button class="text-xs text-amber-500 font-semibold" onclick="Savor.navigate('orders')">View Details &rarr;</button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
            <div class="bg-surface-2 p-3.5 rounded-xl border border-border">
              <span class="text-xs font-semibold text-muted block mb-1">Incoming</span>
              <strong class="text-2xl font-bold text-sky-400">${pending.length}</strong>
              <small class="text-[11px] text-muted block mt-1">Awaiting kitchen</small>
            </div>
            <div class="bg-surface-2 p-3.5 rounded-xl border border-border">
              <span class="text-xs font-semibold text-muted block mb-1">Cooking</span>
              <strong class="text-2xl font-bold text-amber-400">${cooking.length}</strong>
              <small class="text-[11px] text-muted block mt-1">On the burners</small>
            </div>
            <div class="bg-surface-2 p-3.5 rounded-xl border border-border">
              <span class="text-xs font-semibold text-muted block mb-1">At the Pass</span>
              <strong class="text-2xl font-bold text-emerald-400">${ready.length}</strong>
              <small class="text-[11px] text-muted block mt-1">Ready to serve</small>
            </div>
            <div class="bg-surface-2 p-3.5 rounded-xl border border-border">
              <span class="text-xs font-semibold text-muted block mb-1">Served</span>
              <strong class="text-2xl font-bold text-muted">${served.length}</strong>
              <small class="text-[11px] text-muted block mt-1">Dining at tables</small>
            </div>
          </div>

          <div class="mt-5 border-t border-border pt-4">
            <h4 class="text-xs font-bold uppercase tracking-wider text-muted mb-3">Live Order Stream</h4>
            <div class="space-y-2">
              ${orders.slice(0, 5).map(o => `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-surface-2 border border-border/60 text-sm flex-wrap gap-2">
                  <div class="flex items-center gap-3">
                    <strong class="font-mono">${esc(o.code)}</strong>
                    ${tableTag(o)}
                    <span class="text-xs text-muted">${itemCount(o)} items</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold">${peso(orderTotal(o))}</span>
                    ${statusPill(o.status)}
                    ${paymentPill(o)}
                  </div>
                </div>
              `).join('') || '<p class="text-xs text-muted text-center py-4">No orders placed yet.</p>'}
            </div>
          </div>
        </div>

        <div class="card p-5">
          <h3 class="font-bold text-base mb-4 flex items-center gap-2">
            ${icon('award', 'w-4 h-4 text-amber-500')} Top Ordered Dishes
          </h3>
          <div class="space-y-3">
            ${topDishes.map(([name, qty], idx) => `
              <div class="flex items-center justify-between p-3 rounded-xl bg-surface-2 border border-border">
                <div class="flex items-center gap-3">
                  <span class="w-6 h-6 rounded-lg bg-amber-500/15 text-amber-500 font-bold text-xs flex items-center justify-center">#${idx + 1}</span>
                  <span class="font-medium text-sm">${esc(name)}</span>
                </div>
                <strong class="text-sm">${qty} sold</strong>
              </div>
            `).join('') || '<p class="text-xs text-muted py-6 text-center">Data will appear once orders are placed.</p>'}
          </div>

          <div class="mt-6 p-4 rounded-xl bg-surface-2 border border-border text-xs">
            <span class="font-bold block mb-1">Quick Links</span>
            <div class="flex flex-col gap-1.5 mt-2">
              <a href="waiter.html" target="_blank" class="text-amber-500 hover:underline flex items-center gap-1">${icon('external-link', 'w-3 h-3')} Open Waiter Floor Terminal</a>
              <a href="kitchen.html" target="_blank" class="text-amber-500 hover:underline flex items-center gap-1">${icon('external-link', 'w-3 h-3')} Open Kitchen Display Pass</a>
              <a href="cashier.html" target="_blank" class="text-amber-500 hover:underline flex items-center gap-1">${icon('external-link', 'w-3 h-3')} Open Cashier Terminal</a>
            </div>
          </div>
        </div>
      </div>
    `;
      }

      /* ==================== 2. MENU CMS ==================== */
      function viewMenuCMS() {
        const categories = ['All', 'Appetizer', 'Main Dish', 'Dessert', 'Drinks'];
        const q = menuSearch.trim().toLowerCase();

        const filtered = S.state.menu.filter(m => {
          const matchCat = (menuFilter === 'All' || m.category === menuFilter);
          const matchSearch = !q || m.name.toLowerCase().includes(q) || (m.ingredients || '').toLowerCase().includes(q);
          return matchCat && matchSearch;
        });

        return `
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div>
          <h2 class="font-serif text-2xl font-bold tracking-tight">Menu &amp; Dish Catalog CMS</h2>
          <p class="text-sm text-muted mt-1">Upload dish photos, edit prices, recipes, and toggle 86 availability in real-time.</p>
        </div>
        <button class="btn btn-primary" onclick="window.openDishModal()">
          ${icon('plus', 'w-4 h-4')} Add New Dish
        </button>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
          ${categories.map(cat => `
            <button class="btn ${menuFilter === cat ? 'btn-primary' : 'btn-ghost'} py-1.5 px-3.5 text-xs rounded-full whitespace-nowrap" onclick="window.setMenuCat('${cat}')">
              ${cat} (${cat === 'All' ? S.state.menu.length : S.state.menu.filter(m => m.category === cat).length})
            </button>
          `).join('')}
        </div>
        <div class="w-full sm:w-64">
          <input type="text" class="input py-1.5 px-3 text-xs" placeholder="Search dishes or ingredients..." value="${esc(menuSearch)}" oninput="window.setMenuSearch(this.value)">
        </div>
      </div>

      <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        ${filtered.map(dish => `
          <div class="card p-4 flex flex-col justify-between group ${!dish.available ? 'opacity-60 border-dashed' : ''}">
            <div>
              ${menuHero(dish, 'h-40')}

              <div class="flex justify-between items-start mb-1">
                <span class="text-xs text-amber-500 font-semibold uppercase tracking-wider">${esc(dish.category)}</span>
                <button class="pill ${dish.available ? 'pill-paid' : 'pill-alert'} cursor-pointer text-[10px]" onclick="window.toggleDishAvailable('${dish.id}')" title="Click to toggle availability">
                  ${dish.available ? 'Available' : '86 / Sold Out'}
                </button>
              </div>

              <h4 class="font-bold text-base mt-1 group-hover:text-amber-500 transition-colors">${esc(dish.name)}</h4>
              <p class="text-xs text-muted mt-1 line-clamp-2">${esc(dish.description || 'No description provided.')}</p>
              ${dish.ingredients ? `<small class="text-[11px] text-muted/80 block mt-2 italic line-clamp-1">Ingredients: ${esc(dish.ingredients)}</small>` : ''}
            </div>

            <div class="mt-4 pt-3 border-t border-border flex items-center justify-between">
              <div>
                <strong class="text-base font-bold text-ink">${peso(dish.price)}</strong>
              </div>
              <div class="flex items-center gap-1">
                <button class="icon-btn w-7 h-7 text-xs" onclick="window.openDishModal('${dish.id}')" title="Edit Dish">${icon('pencil', 'w-3.5 h-3.5')}</button>
                <button class="icon-btn w-7 h-7 text-xs text-rose-500 hover:bg-rose-500/10" onclick="window.deleteDish('${dish.id}')" title="Delete Dish">${icon('trash-2', 'w-3.5 h-3.5')}</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      ${filtered.length === 0 ? `<div class="card p-12 text-center text-muted mt-4">No dishes found matching your criteria.</div>` : ''}
    `;
      }

      /* ==================== 4. ORDERS AUDIT LOG ==================== */
      function viewOrdersCMS() {
        const allOrders = S.state.orders;
        const dayOrders = filterOrdersByDay(allOrders, ordersDayFilter, ordersCustomDate);
        const q = ordersSearch.trim().toLowerCase();

        const filtered = dayOrders.filter(o => {
          const matchFilter = (ordersFilter === 'ALL') ||
            (ordersFilter === 'ACTIVE' && (o.status === 'PENDING' || o.status === 'PREPARING' || o.status === 'READY')) ||
            (ordersFilter === 'PAID' && o.payment === 'PAID') ||
            (ordersFilter === 'UNPAID' && o.payment !== 'PAID');
          const matchSearch = !q || o.code.toLowerCase().includes(q) || (o.table || '').toLowerCase().includes(q) || (o.customer || '').toLowerCase().includes(q);
          return matchFilter && matchSearch;
        });

        let dayLabel = 'All Days';
        if (ordersDayFilter === 'TODAY') dayLabel = 'Today';
        else if (ordersDayFilter === 'YESTERDAY') dayLabel = 'Yesterday';
        else if (ordersDayFilter === 'CUSTOM') dayLabel = S.fmtDate(new Date(ordersCustomDate).getTime());

        return `
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div>
          <h2 class="font-serif text-2xl font-bold tracking-tight">Orders &amp; Audit Log</h2>
          <p class="text-sm text-muted mt-1">Full audit history of all tickets, dish progress, and payment settlements per day.</p>
        </div>
        <span class="pill pill-paid text-xs font-semibold">${dayLabel} · ${filtered.length} tickets</span>
      </div>

      <div class="card p-4 mb-6 bg-surface-2/40 border border-border flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center gap-1 bg-surface-2 p-1 rounded-xl border border-border text-xs">
            <span class="text-muted font-bold px-2 uppercase text-[11px]">${icon('calendar', 'w-3 h-3 inline mr-1 text-amber-500')} Day:</span>
            <button class="btn ${ordersDayFilter === 'TODAY' ? 'btn-primary' : 'btn-ghost'} py-1 px-2.5 text-xs rounded-lg" onclick="window.setOrdersDayFilter('TODAY')">Today</button>
            <button class="btn ${ordersDayFilter === 'YESTERDAY' ? 'btn-primary' : 'btn-ghost'} py-1 px-2.5 text-xs rounded-lg" onclick="window.setOrdersDayFilter('YESTERDAY')">Yesterday</button>
            <button class="btn ${ordersDayFilter === 'ALL' ? 'btn-primary' : 'btn-ghost'} py-1 px-2.5 text-xs rounded-lg" onclick="window.setOrdersDayFilter('ALL')">All Days</button>
            <input type="date" class="input py-0.5 px-2 text-xs font-mono ml-1" value="${ordersCustomDate}" onchange="window.setOrdersCustomDate(this.value)">
          </div>

          <div class="flex items-center gap-1 bg-surface-2 p-1 rounded-xl border border-border text-xs">
            ${['ALL', 'ACTIVE', 'PAID', 'UNPAID'].map(f => `
              <button class="btn ${ordersFilter === f ? 'btn-primary' : 'btn-ghost'} py-1 px-2.5 text-xs rounded-lg" onclick="window.setOrdersFilter('${f}')">
                ${f}
              </button>
            `).join('')}
          </div>
        </div>

        <div class="w-full sm:w-64">
          <input type="text" class="input py-1.5 px-3 text-xs" placeholder="Search order code or table..." value="${esc(ordersSearch)}" oninput="window.setOrdersSearch(this.value)">
        </div>
      </div>

      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm" data-mobile-cards>
            <thead class="bg-surface-2 border-b border-border text-xs uppercase text-muted">
              <tr>
                <th class="p-3.5">Code</th>
                <th class="p-3.5">Table / Guest</th>
                <th class="p-3.5">Items</th>
                <th class="p-3.5">Total</th>
                <th class="p-3.5">Status</th>
                <th class="p-3.5">Payment</th>
                <th class="p-3.5">Time</th>
                <th class="p-3.5 text-right">Action</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-border">
              ${filtered.map(o => `
                <tr class="hover:bg-surface-2/50 transition-colors">
                  <td class="p-3.5 font-mono font-bold" data-label="Code">${esc(o.code)}</td>
                  <td class="p-3.5" data-label="Table">${tableTag(o) || '<span class="text-muted text-xs">—</span>'}</td>
                  <td class="p-3.5 max-w-xs truncate text-xs" data-label="Items">${esc(itemSummary(o))}</td>
                  <td class="p-3.5 font-bold" data-label="Total">${peso(orderTotal(o))}</td>
                  <td class="p-3.5" data-label="Status">${statusPill(o.status)}</td>
                  <td class="p-3.5" data-label="Payment">${paymentPill(o)}</td>
                  <td class="p-3.5 text-xs text-muted" data-label="Time">${fmtDateTime(o.createdAt)}</td>
                  <td class="p-3.5 text-right" data-label="">
                    <button class="btn btn-ghost py-1 px-2.5 text-xs" onclick="window.inspectOrder('${o.id}')">View</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        ${filtered.length === 0 ? `<p class="p-8 text-center text-xs text-muted">No orders found for ${dayLabel}.</p>` : ''}
      </div>
    `;
      }

      /* ==================== 5. STAFF PINs ==================== */
      function viewStaffCMS() {
        const accounts = S.state.accounts;

        return `
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div>
          <h2 class="font-serif text-2xl font-bold tracking-tight">Staff &amp; 4-Digit PIN Access CMS</h2>
          <p class="text-sm text-muted mt-1">Manage staff accounts. Usernames are names only (letters only). PINs are 4 digits for station sign-in.</p>
        </div>
        <button class="btn btn-primary" onclick="window.openStaffModal()">
          ${icon('user-plus', 'w-4 h-4')} Add Staff Account
        </button>
      </div>

      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm" data-mobile-cards>
            <thead class="bg-surface-2 border-b border-border text-xs uppercase text-muted">
              <tr>

      window.saveStaffForm = async (e, id) => {
        e.preventDefault();
        const pin = document.getElementById('staff-pin').value.trim();
        if (pin.length !== 4) {
          toast('PIN must be exactly 4 numbers!', 3000, 'alert');
          return;
        }

        const acc = id ? S.state.accounts.find(a => a.id === id) : null;
        const isAdminAcc = acc && (acc.role === 'Admin' || acc.id === 'acc-admin' || !acc.username || acc.username === 'admin');

        if (isAdminAcc) {
          acc.pin = pin;
          acc.role = 'Admin';
          acc.status = 'Active';
          delete acc.username;
          delete acc.password;
          await S.Data.saveAccount(acc);
          S.Modal.close();
          toast(`Admin Master PIN updated to ${pin}.`, 3000, 'success');
          render();
          return;
        }

        const username = S.sanitizeUsername(document.getElementById('staff-user').value);
        const role = document.getElementById('staff-role').value;
        const status = document.getElementById('staff-status').value;
        const name = username ? (username.charAt(0).toUpperCase() + username.slice(1)) : 'Staff';

        if (!username) {
          toast('Username must contain letters or numbers!', 3000, 'alert');
          return;
        }

        const existingSameUser = S.state.accounts.find(a => a.id !== (id || '') && a.username && a.username.toLowerCase() === username.toLowerCase());
        if (existingSameUser) {
          toast(`An account with username @${username} already exists! Please choose another username.`, 3500, 'alert');
          return;
        }

        const account = { id: id || S.uid('acc'), name, username, pin, role, status };
        await S.Data.saveAccount(account);
        S.Modal.close();
        toast(`Staff @${username} (${role} · PIN: ${pin}) saved!`, 3000, 'success');
        render();
      };

        const acc = S.state.accounts.find(a => a.id === id);
        const uname = acc ? acc.username : 'this staff';

        S.Modal.open(`
      <div class="p-6 max-w-sm mx-auto text-center">
        <div class="w-12 h-12 rounded-2xl bg-rose-500/15 text-rose-500 border border-rose-500/30 mx-auto flex items-center justify-center mb-3">
          ${icon('user-minus', 'w-6 h-6')}
        </div>
        <h3 class="font-serif font-bold text-lg text-ink">Delete Staff Account?</h3>
        <p class="text-xs text-muted mt-2 leading-relaxed">
          Are you sure you want to remove <b class="text-ink">@${esc(uname)}</b>? They will no longer be able to log in to POS stations.
        </p>
        <div class="flex gap-2.5 mt-5">
          <button type="button" class="btn btn-ghost flex-1 justify-center py-2 text-xs" onclick="Savor.Modal.close()">
            Cancel
          </button>
          <button type="button" class="btn bg-rose-600 hover:bg-rose-700 text-white font-semibold flex-1 justify-center py-2 text-xs shadow-lg shadow-rose-600/20" onclick="window.confirmDeleteStaff('${id}')">
            ${icon('trash-2', 'w-3.5 h-3.5')} Delete Staff
          </button>
        </div>
      </div>
    `);
      };

      window.confirmDeleteStaff = async (id) => {
        await S.Data.deleteAccount(id);
        S.Modal.close();
        toast('Staff account deleted.', 2000, 'info');
        render();
      };

      window.inspectOrder = (id) => {
        const o = S.state.orders.find(ord => ord.id === id);
        if (!o) return;

        S.Modal.open(`
      <div class="p-6 max-w-lg mx-auto">
        <div class="flex justify-between items-start mb-4">
          <div>
            <h3 class="font-serif font-bold text-2xl font-mono">${esc(o.code)}</h3>
            <p class="text-xs text-muted mt-1">${tableTag(o)} · Taken by ${esc(o.staff || 'Staff')}</p>
          </div>
          <div class="flex items-center gap-2">
            ${statusPill(o.status)}
            ${paymentPill(o)}
          </div>
        </div>

        <div class="divide-y divide-border border-y border-border my-4 py-2">
          ${(o.items || []).map(item => `
            <div class="py-2.5 flex justify-between items-center text-sm">
              <div>
                <strong>${item.qty}× ${esc(item.name)}</strong>
                ${item.note ? `<small class="block text-xs text-amber-500 font-semibold italic">Note: ${esc(item.note)}</small>` : ''}
              </div>
              <div class="text-right">
                <span class="font-bold">${peso((item.price || 0) * (item.qty || 1))}</span>
                <small class="block text-[11px] ${item.ready ? 'text-emerald-500' : 'text-muted'}">${item.served ? 'Served' : item.ready ? 'Ready at pass' : 'Cooking'}</small>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="space-y-1.5 text-sm mb-6">
          <div class="flex justify-between text-muted"><span>Subtotal:</span><span>${peso(orderTotal(o))}</span></div>
          ${o.discount ? `<div class="flex justify-between text-emerald-500 font-semibold"><span>Discount:</span><span>-${peso(o.discount)}</span></div>` : ''}
          <div class="flex justify-between text-lg font-bold pt-2 border-t border-border"><span>Total Due:</span><span>${peso(orderTotal(o))}</span></div>
        </div>

        <div class="flex gap-2">
          ${o.payment !== 'PAID' ? `
            <button class="btn btn-primary flex-1 justify-center" onclick="window.quickPay('${o.id}')">
              ${icon('check-check', 'w-4 h-4')} Settle &amp; Mark Paid
            </button>
          ` : `
            <span class="pill pill-paid py-2 px-4 justify-center flex-1">Settled at ${fmtDateTime(o.paidAt)}</span>
          `}
          <button class="btn btn-ghost" onclick="Savor.Modal.close()">Close</button>
        </div>
      </div>
    `);
      };

      window.quickPay = async (id) => {
        await S.Data.markPaid(id);
        S.Modal.close();
        toast('Order payment marked as settled!', 3000, 'success');
        render();
      };

      window.setSettingsResetDate = (val) => {
        settingsResetDate = val || S.fmtDateKey(Date.now());
        render();
      };

      window.promptResetDayOrders = (targetDateKey) => {
        targetDateKey = targetDateKey || settingsResetDate || S.fmtDateKey(Date.now());
        const dayOrders = S.state.orders.filter(o => S.fmtDateKey(o.createdAt || o.created_at || Date.now()) === targetDateKey);
        const isTargetToday = (targetDateKey === S.fmtDateKey(Date.now()));
        const readableDate = isTargetToday ? 'Today (' + targetDateKey + ')' : targetDateKey;
        const totalDaySales = dayOrders.reduce((sum, o) => sum + S.orderTotal(o), 0);

        S.Modal.open(`
      <div class="p-6 max-w-md mx-auto text-center">
        <div class="w-14 h-14 rounded-2xl bg-rose-500/15 text-rose-500 border border-rose-500/30 mx-auto flex items-center justify-center mb-4">
          ${icon('alert-triangle', 'w-7 h-7')}
        </div>
        <h3 class="font-serif font-bold text-2xl text-ink">Reset Orders for ${esc(readableDate)}?</h3>
        <p class="text-xs text-muted mt-2 leading-relaxed">
          You are about to permanently clear all <strong class="text-rose-500 font-bold">${dayOrders.length} order(s) and settlement history</strong> made on <strong class="text-ink">${esc(readableDate)}</strong>.
        </p>
        <div class="p-3.5 my-4 bg-surface-2 rounded-xl border border-border text-left text-xs space-y-1.5">
          <div class="flex justify-between">
            <span class="text-muted">Target Day:</span>
            <strong class="font-mono text-ink">${esc(targetDateKey)}</strong>
          </div>
          <div class="flex justify-between">
            <span class="text-muted">Orders to be cleared:</span>
            <strong class="font-mono text-rose-400">${dayOrders.length} ticket(s)</strong>
          </div>
          <div class="flex justify-between">
            <span class="text-muted">Total day revenue:</span>
            <strong class="font-mono text-amber-500">${S.peso(totalDaySales)}</strong>
          </div>
          <div class="flex justify-between pt-1 border-t border-border/60">
            <span class="text-muted">Menu items &amp; Staff:</span>
            <span class="text-emerald-500 font-medium">Safe &amp; Untouched</span>
          </div>
        </div>
        <p class="text-[11px] text-muted italic mb-5">
          Floor tables associated with these orders will immediately return to "AVAILABLE". This action cannot be undone.
        </p>
        <div class="flex gap-2.5">
          <button type="button" class="btn btn-ghost flex-1 justify-center py-2 text-xs" onclick="Savor.Modal.close()">
            Cancel
          </button>
          <button type="button" class="btn bg-rose-600 hover:bg-rose-700 text-white font-semibold flex-1 justify-center py-2 text-xs shadow-lg shadow-rose-600/20 flex items-center gap-1.5" onclick="window.executeResetDayOrders('${targetDateKey}')">
            ${icon('trash-2', 'w-4 h-4')} Yes, Reset ${dayOrders.length} Order(s)
          </button>
        </div>
      </div>
    `);
      };

      window.executeResetDayOrders = async (targetDateKey) => {
        const res = await S.Data.deleteOrdersByDay(targetDateKey);
        S.Modal.close();
        toast(`Reset complete: ${res.count} order(s) and history for ${targetDateKey} cleared.`, 3500, 'success');
        render();
      };

      window.saveSettingsDb = () => {
        const url = document.getElementById('set-url')?.value.trim() || '';
        const key = document.getElementById('set-key')?.value.trim() || '';
        S.CONFIG.SUPABASE_URL = S.cleanSupabaseUrl(url);
        S.CONFIG.SUPABASE_KEY = key;
        S.safeSet('savor.supabase_url', S.CONFIG.SUPABASE_URL);
        S.safeSet('savor.supabase_key', S.CONFIG.SUPABASE_KEY);
        toast('Connecting to Supabase Cloud...', 3000, 'info');
        S.initSupabase().then(() => {
          toast('Supabase cloud connected and live!', 3000, 'success');
          render();
        });
      };

      window.disconnectCloud = () => {
        S.Modal.open(`
      <div class="p-6 max-w-sm mx-auto text-center">
        <div class="w-12 h-12 rounded-2xl bg-amber-500/15 text-amber-500 border border-amber-500/30 mx-auto flex items-center justify-center mb-3">
          ${icon('power', 'w-6 h-6')}
        </div>
        <h3 class="font-serif font-bold text-lg text-ink">Disconnect Cloud Database?</h3>
        <p class="text-xs text-muted mt-2 leading-relaxed">
          Switch to local offline storage on this device? Your local data will remain intact.
        </p>
        <div class="flex gap-2.5 mt-5">
          <button type="button" class="btn btn-ghost flex-1 justify-center py-2 text-xs" onclick="Savor.Modal.close()">
            Cancel
          </button>
          <button type="button" class="btn btn-primary flex-1 justify-center py-2 text-xs" onclick="window.confirmDisconnectCloud()">
            Disconnect
          </button>
        </div>
      </div>
    `);
      };

      window.confirmDisconnectCloud = () => {
        S.CONFIG.SUPABASE_URL = '';
        S.CONFIG.SUPABASE_KEY = '';
        S.safeSet('savor.supabase_url', '');
        S.safeSet('savor.supabase_key', '');
        if (S.state.supabaseClient && S.state.realtimeChannel) {
          try { S.state.supabaseClient.removeChannel(S.state.realtimeChannel); } catch (e) { }
        }
        S.state.supabaseClient = null;
        S.state.realtimeChannel = null;
        S.setNet('local');
        S.Modal.close();
        toast('Switched to Local Offline Storage.', 3000, 'info');
        render();
      };

      S.boot({ role: 'admin', defaultScreen: 'dashboard', render: render });
    })();
  </script>
</body>

</html>
