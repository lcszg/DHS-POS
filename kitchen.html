<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#211F1C">
<title>Kitchen — Savor &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ bg:'var(--bg)',surface:'var(--surface)',ink:'var(--text)',muted:'var(--text-muted)' }, fontFamily:{ sans:['DM Sans','system-ui','sans-serif'], serif:['Fraunces','Georgia','serif'] } } } };</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const S = window.Savor;
  const session = S.requireRole('kitchen');
  if(!session) return;
  S.session = session;

  const { $, esc, icon, peso, toast, setHtml, statusPill, orderTotal, hasMeta, orderMetaText, tableTag,
          itemCount, readyCount, unreadyCount, itemSummary, allNotes, kitchenProgress,
          emptyState, fmtTime } = S;

  S.navBadge = function(key){
    if(key === 'incoming'){
      const n = S.state.orders.filter(o => o.status === 'PENDING').length;
      if(n > 0) return `<span class="nav-badge">${n}</span>`;
    }
    return '';
  };
  S.onRender = function(){ render(); };
  S.onDataChanged = function(ctx){
    const newOnes = S.state.orders.filter(o => !ctx.beforeStatuses.has(o.id));
    if(newOnes.length > 0){
      const first = newOnes[0];
      const meta = hasMeta(first) ? ` (${orderMetaText(first)})` : '';
      toast(`🔔 New order ${first.code}${meta}`, 5000, 'info');
      if(S.state.sound) S.chime();
    }
  };

  function viewIncoming(){
    const list = S.state.orders.filter(o => o.status === 'PENDING');
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">New orders</h2><p class="text-muted text-sm mt-1">Tap Accept order to start cooking. Accepted orders move to At the pass.</p></div>
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost" onclick="Savor.toggleSound()">${icon(S.state.sound ? 'volume-2' : 'volume-x','w-4 h-4')} ${S.state.sound ? 'Sound on' : 'Muted'}</button>
        ${list.length ? `<span class="pill pill-pending">${list.length} pending</span>` : `<span class="pill pill-completed">All caught up</span>`}
      </div>
    </div>
    ${list.length ? `<div class="grid lg:grid-cols-2 xl:grid-cols-3 gap-4 mt-5">${list.map(ticket).join('')}</div>`
      : `<div class="mt-6">${emptyState('inbox','No new orders','When the waiter sends an order, it will appear here for you to accept.')}</div>`}`;
  }

  function viewActive(){
    const list = S.state.orders.filter(o => o.status === 'PREPARING' || o.status === 'READY')
      .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">At the pass</h2><p class="text-muted text-sm mt-1">Tap Ready on each item as it finishes. First ready item signals the waiter.</p></div>
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost" onclick="Savor.toggleSound()">${icon(S.state.sound ? 'volume-2' : 'volume-x','w-4 h-4')} ${S.state.sound ? 'Sound on' : 'Muted'}</button>
        ${list.length ? `<span class="pill pill-preparing">${list.length} active</span>` : `<span class="pill pill-completed">Nothing cooking</span>`}
      </div>
    </div>
    ${list.length ? `<div class="grid lg:grid-cols-2 xl:grid-cols-3 gap-4 mt-5">${list.map(ticket).join('')}</div>`
      : `<div class="mt-6">${emptyState('chef-hat','Nothing cooking','Accept a new order to start cooking.')}</div>`}`;
  }

  /* ===== HISTORY — responsive cards, grouped by date ===== */
  function groupByDate(orders, key){
    const todayStr = new Date().toDateString();
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toDateString();
    const groups = {};
    orders.forEach(o => {
      const ts = o[key] || o.updatedAt || o.createdAt;
      const d = new Date(ts);
      let label;
      if(d.toDateString() === todayStr) label = 'Today';
      else if(d.toDateString() === yesterdayStr) label = 'Yesterday';
      else label = d.toLocaleDateString('en-PH', { weekday:'short', month:'short', day:'numeric' });
      if(!groups[label]) groups[label] = [];
      groups[label].push(o);
    });
    return groups;
  }

  function historyCard(order){
    const servedAt = order.updatedAt || order.createdAt;
    const items = order.items || [];
    return `
    <article class="card soft overflow-hidden flex flex-col">
      <div class="p-4 flex flex-col flex-1">
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0">
            <p class="font-bold text-lg leading-tight">${esc(order.code)}</p>
            ${hasMeta(order) ? `<div class="mt-1.5">${tableTag(order)}</div>` : ''}
          </div>
          <span class="pill pill-ready !text-[11px] !py-1 !px-2.5 flex-none">
            ${icon('check','w-3 h-3 inline -mt-0.5 mr-0.5')} SERVED
          </span>
        </div>
        <div class="mt-3 space-y-1 text-sm flex-1">
          ${items.map(i => `<div class="flex justify-between gap-2">
            <span class="font-semibold truncate">${i.qty} × ${esc(i.name)}</span>
            ${i.price ? `<span class="text-muted text-xs flex-none">${peso(Number(i.price) * i.qty)}</span>` : ''}
          </div>`).join('')}
        </div>
        <div class="flex justify-between items-center mt-3 pt-2 border-t text-sm" style="border-color:var(--border)">
          <div class="text-xs text-muted">
            ${icon('clock','w-3 h-3 inline -mt-0.5 mr-1')}${fmtTime(servedAt)}
            ${order.staff ? ` · ${esc(order.staff)}` : ''}
          </div>
          <strong class="text-base">${peso(orderTotal(order))}</strong>
        </div>
      </div>
    </article>`;
  }

  function viewHistory(){
    const done = S.state.orders.filter(o => o.status === 'COMPLETED')
      .sort((a,b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));

    const todayStr = new Date().toDateString();
    const todayDone = done.filter(o => {
      const d = new Date(o.updatedAt || o.createdAt);
      return d.toDateString() === todayStr;
    });
    const todayRevenue = todayDone.reduce((s, o) => s + orderTotal(o), 0);

    const groups = groupByDate(done, 'updatedAt');
    const groupKeys = Object.keys(groups);

    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div>
        <h2 class="font-serif text-2xl md:text-3xl font-bold">Kitchen history</h2>
        <p class="text-muted text-sm mt-1">
          ${done.length} ticket${done.length === 1 ? '' : 's'} served${todayDone.length ? ` · ${todayDone.length} today · ${peso(todayRevenue)}` : ''}
        </p>
      </div>
      <span class="pill ${done.length ? 'pill-ready' : 'pill-completed'}">${done.length} served</span>
    </div>

    ${!done.length ? `<div class="mt-6">${emptyState('history','No served tickets yet','When you mark items ready and waiters serve them, they appear here.')}</div>` : ''}

    ${groupKeys.map(groupLabel => {
      const orders = groups[groupLabel];
      const groupTotal = orders.reduce((s, o) => s + orderTotal(o), 0);
      return `
        <section class="mt-6">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-xs uppercase tracking-[.14em] text-muted">${groupLabel}</h3>
            <span class="text-xs text-muted">${orders.length} order${orders.length === 1 ? '' : 's'} · ${peso(groupTotal)}</span>
          </div>
          <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3 md:gap-4">
            ${orders.map(historyCard).join('')}
          </div>
        </section>`;
    }).join('')}`;
  }

  function viewSettings(){
    return `
    <h2 class="font-serif text-2xl md:text-3xl font-bold">Kitchen settings</h2>
    <div class="grid md:grid-cols-2 gap-5 mt-6 max-w-4xl">
      <section class="card soft p-5"><h3 class="font-bold">Display preferences</h3><div class="mt-2">
        <div class="flex items-center justify-between gap-4 py-4 border-t" style="border-color:var(--border)"><div><span class="font-semibold text-sm block">Dark mode</span></div><button class="toggle ${S.state.dark ? 'on' : ''}" onclick="Savor.toggleTheme()"><span></span></button></div>
        <div class="flex items-center justify-between gap-4 py-4 border-t" style="border-color:var(--border)"><div><span class="font-semibold text-sm block">Order sound</span></div><button class="toggle ${S.state.sound ? 'on' : ''}" onclick="Savor.toggleSound()"><span></span></button></div>
      </div></section>
      <section class="card soft p-5">
        <h3 class="font-bold">Data source</h3>
        <div class="rounded-xl p-4 mt-4" style="background:var(--${(S.state.net === 'sheets' || S.state.net === 'sql') ? 'success-soft' : S.state.net === 'offline' ? 'danger-soft' : 'warn-soft'});color:var(--${(S.state.net === 'sheets' || S.state.net === 'sql') ? 'success' : S.state.net === 'offline' ? 'danger' : 'warn'})">
          <strong>${(S.state.net === 'sheets' || S.state.net === 'sql') ? 'Live — connected to Cloud Database' : S.state.net === 'offline' ? 'Database unreachable — retrying automatically' : 'Local demo mode'}</strong>
        </div>
        <button class="btn btn-ghost mt-4" onclick="Savor.refreshNow()">${icon('refresh-cw','w-4 h-4')} Refresh now</button>
      </section>
    </div>`;
  }

  function ticket(order){
    const isPending = order.status === 'PENDING';
    const notes = allNotes(order);
    const waiting = Math.max(0, Math.round((Date.now() - new Date(order.createdAt).getTime()) / 60000));
    const unready = unreadyCount(order);
    return `
    <article class="card soft overflow-hidden border-t-4 flex flex-col" style="border-top-color:${isPending ? 'var(--info)' : (unready === 0 ? 'var(--success)' : 'var(--primary)')}">
      <div class="p-5 flex flex-col flex-1">
        <div class="flex justify-between items-start gap-3">
          <div class="min-w-0">
            <p class="font-bold text-xl leading-none">${esc(order.code)}</p>
            ${hasMeta(order) ? `<div class="mt-2">${tableTag(order)}</div>` : ''}
            <p class="text-xs font-semibold mt-2 text-muted">Sent ${fmtTime(order.createdAt)}${waiting ? ` · ${waiting} min ago` : ''}</p>
          </div>
          ${statusPill(order.status)}
        </div>
        ${!isPending ? kitchenProgress(order) : ''}
        <div class="mt-3 space-y-1.5 flex-1">
          ${order.items.map((i, idx) => {
            const cls = i.ready ? 'is-ready' : '';
            return `<div class="item-row ${cls}">
              <span class="item-check">${i.ready ? icon('check','w-3 h-3') : ''}</span>
              <div class="flex-1 min-w-0">
                <div class="item-name text-sm font-semibold">${i.qty} × ${esc(i.name)}</div>
                ${i.note ? `<div class="text-xs text-muted mt-0.5">Note: ${esc(i.note)}</div>` : ''}
                ${i.ready && i.readyAt ? `<div class="text-[10px] mt-0.5" style="color:var(--success)">Ready ${fmtTime(i.readyAt)}</div>` : ''}
                ${i.served && i.servedAt ? `<div class="text-[10px] mt-0.5" style="color:var(--success)">Served ${fmtTime(i.servedAt)}</div>` : ''}
              </div>
              ${!isPending && !i.ready ? `<button class="btn btn-success !py-1.5 !px-3 !text-xs" onclick="KT.markItemReady('${order.id}', ${idx})">${icon('check','w-3 h-3')} Ready</button>` : ''}
            </div>`;
          }).join('')}
        </div>
        ${notes.length ? `<div class="rounded-xl p-3 mt-4 text-xs" style="background:var(--primary-soft);color:var(--primary)"><strong class="block mb-1">Chef notes</strong>${notes.map(n => `<div>• ${esc(n)}</div>`).join('')}</div>` : ''}
        <div class="flex justify-between items-center mt-4 pt-3 border-t text-xs" style="border-color:var(--border)">
          <span class="text-muted">Order total</span><strong>${peso(orderTotal(order))}</strong>
        </div>
        ${isPending ? `<button class="btn btn-primary w-full mt-3" onclick="KT.accept('${order.id}')">${icon('inbox','w-4 h-4')} Accept order</button>`
        : unready > 1 ? `<button class="btn btn-ghost w-full mt-3" onclick="KT.markAllReady('${order.id}')">${icon('check-check','w-4 h-4')} Mark all ready (${unready})</button>` : ''}
      </div>
    </article>`;
  }

  function render(){
    const map = { incoming: viewIncoming, active: viewActive, history: viewHistory, settings: viewSettings };
    const fn = map[S.screen] || viewIncoming;
    const titles = { incoming:'New orders', active:'At the pass', history:'History', settings:'Kitchen settings' };
    document.getElementById('screen-eyebrow').textContent = 'KITCHEN PASS';
    document.getElementById('screen-title').textContent = titles[S.screen] || 'New orders';
    setHtml(document.getElementById('main'), fn());
    document.getElementById('main').firstElementChild?.classList.add('screen-enter');
    S._renderNav();
    S.setNet(S.state.net);
    const pending = S.state.orders.filter(o => o.status === 'PENDING').length;
    document.title = pending > 0 ? `(${pending}) Kitchen — Savor` : 'Kitchen — Savor & Co.';
  }

  async function accept(id){
    const order = S.state.orders.find(o => o.id === id); if(!order) return;
    await S.Data.setStatus(id, 'PREPARING', session.name || 'Kitchen');
    S.toast(`${order.code} accepted — now cooking`);
    if(S.state.sound) S.chime();
    render();
  }
  async function markItemReady(orderId, itemIndex){
    const order = S.state.orders.find(o => o.id === orderId); if(!order) return;
    if(order.status === 'PENDING'){ S.toast('Accept the order first.'); return; }
    const item = order.items[itemIndex]; if(!item || item.ready) return;
    const wasFirst = readyCount(order) === 0;
    await S.Data.markItemReady(orderId, itemIndex);
    if(wasFirst){ S.toast(`${item.name} ready — waiter signaled 🔔`); if(S.state.sound) S.chime(); }
    else S.toast(`${item.name} ready`);
    render();
  }
  async function markAllReady(orderId){
    const order = S.state.orders.find(o => o.id === orderId); if(!order) return;
    const remaining = order.items.map((it, i) => ({ it, i })).filter(x => !x.it.ready);
    if(!remaining.length) return;
    for(const { i } of remaining) await S.Data.markItemReady(orderId, i);
    S.toast(`${order.code} — all items ready 🔔 waiter signaled`);
    if(S.state.sound) S.chime();
    render();
  }

  window.KT = { accept, markItemReady, markAllReady };

  S.boot({ role: 'kitchen', defaultScreen: 'incoming', render });
})();
</script>
</body>
</html>
