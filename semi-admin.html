<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#211F1C">
<title>Semi Admin — Savor &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ bg:'var(--bg)',surface:'var(--surface)',ink:'var(--text)',muted:'var(--text-muted)' }, fontFamily:{ sans:['DM Sans','system-ui','sans-serif'], serif:['Fraunces','Georgia','serif'] } } } };</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
  const S = window.Savor;
  const { $, esc, icon, peso, toast, setHtml, statusPill, paymentPill, orderTotal, hasMeta, orderMetaText,
          tableLine, itemCount, readyCount, unreadyCount, servedCount, itemSummary, allNotes,
          kitchenProgress, servedProgress, emptyState, fmtTime, CATEGORIES,
          artClass, menuHero } = S;

  let filter = 'All';
  function filteredMenu(){ return S.state.menu.filter(m => filter === 'All' || m.category === filter); }
  function setFilter(c){ filter = c; render(); }

  function startApp(session){
    S.session = session || { id: 'semi_admin', name: 'Floor Manager', username: 'semi_admin', role: 'Semi Admin' };
    S.navBadge = function(key){
      if(key === 'orders'){
        const n = S.state.orders.filter(o => o.status === 'PENDING').length;
        if(n > 0) return `<span class="nav-badge">${n}</span>`;
      }
      return '';
    };
    S.onRender = render;
    S.onDataChanged = function(){};
    S.boot({ role: 'semi_admin', defaultScreen: 'menu', render: render });
  }

  /* ===== 1. MENU EDITOR SCREEN (Add, Edit, Remove Menu) ===== */
  function viewMenu(){
    const counts = ['Appetizer','Main Dish','Dessert','Drinks'].map(c => `${S.state.menu.filter(m => m.category === c).length} ${c.toLowerCase()}${c.endsWith('s') ? '' : 's'}`).join(' · ');
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div>
        <h2 class="font-serif text-2xl md:text-3xl font-bold">Menu Manager</h2>
        <p class="text-muted text-sm mt-1">${S.state.menu.length} items · ${counts}</p>
      </div>
      <button class="btn btn-primary" onclick="SA.openMenuItemModal('')">${icon('plus','w-4 h-4')} Add new dish</button>
    </div>

    <div class="flex gap-2 mt-4 overflow-x-auto pb-1">
      ${CATEGORIES.map(c => `<button class="pill ${filter === c ? 'pill-preparing' : 'pill-completed'}" onclick="SA.setFilter('${c}')">${c}</button>`).join('')}
    </div>

    <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-5">
      ${filteredMenu().map(item => `
        <article class="card soft overflow-hidden flex flex-col">
          ${menuHero(item, 'h-32', 'text-5xl')}
          <div class="p-4 flex flex-col flex-1">
            <div class="flex justify-between gap-2 items-start">
              <div class="min-w-0">
                <h3 class="font-bold truncate">${esc(item.name)}</h3>
                <p class="text-xs text-muted mt-0.5">${esc(item.category)}</p>
              </div>
              <span class="pill ${item.available ? 'pill-ready' : 'pill-completed'}">${item.available ? 'Available' : 'Hidden'}</span>
            </div>
            <p class="text-sm text-muted mt-2 line-clamp-2">${esc(item.description || '')}</p>
            <div class="flex justify-between items-center mt-3 pt-3 border-t" style="border-color:var(--border)">
              <strong class="text-base" style="color:var(--primary)">${peso(item.price)}</strong>
              <div class="flex gap-1.5">
                <button class="btn btn-ghost !py-1.5 !px-2.5 text-xs font-semibold" onclick="SA.openMenuItemModal('${item.id}')">
                  ${icon('pencil','w-3.5 h-3.5')} Edit
                </button>
                <button class="btn btn-ghost !py-1.5 !px-2.5 text-xs font-semibold" style="color:var(--danger)" onclick="SA.deleteMenuItemConfirm('${item.id}')">
                  ${icon('trash-2','w-3.5 h-3.5')} Remove
                </button>
              </div>
            </div>
          </div>
        </article>
      `).join('') || `<div class="col-span-full card soft p-10 text-center text-muted">No items in this category. Tap "Add new dish".</div>`}
    </div>`;
  }

  /* ===== 2. ORDERS SCREEN (Live Orders Tracking) ===== */
  function viewOrders(){
    const list = S.state.orders.slice(0, 60);
    const pending = S.state.orders.filter(o => o.status === 'PENDING').length;
    const cooking = S.state.orders.filter(o => o.status === 'PREPARING').length;
    const ready = S.state.orders.filter(o => o.status === 'READY').length;

    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div>
        <h2 class="font-serif text-2xl md:text-3xl font-bold">Live Orders</h2>
        <p class="text-muted text-sm mt-1">Real-time orders from floor staff &amp; kitchen pass.</p>
      </div>
      <button class="btn btn-ghost" onclick="Savor.refreshNow()">${icon('refresh-cw','w-4 h-4')} Refresh</button>
    </div>

    <div class="grid grid-cols-3 gap-3 mt-4">
      <div class="card soft p-3.5 text-center">
        <span class="text-xs text-muted block">Pending</span>
        <strong class="text-2xl mt-1 block" style="color:var(--info)">${pending}</strong>
      </div>
      <div class="card soft p-3.5 text-center">
        <span class="text-xs text-muted block">Cooking</span>
        <strong class="text-2xl mt-1 block" style="color:var(--warn)">${cooking}</strong>
      </div>
      <div class="card soft p-3.5 text-center">
        <span class="text-xs text-muted block">Ready to Serve</span>
        <strong class="text-2xl mt-1 block" style="color:var(--success)">${ready}</strong>
      </div>
    </div>

    ${list.length ? `
      <div class="grid gap-4 mt-5">
        ${list.map(o => `
          <article class="card soft p-5 flex flex-wrap justify-between gap-4">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-3 flex-wrap">
                <h3 class="font-bold text-lg">${esc(o.code)}</h3>
                ${statusPill(o.status)}
                ${paymentPill(o)}
              </div>
              ${tableLine(o)}
              <p class="mt-2 text-xs text-muted">Sent ${fmtTime(o.createdAt)}</p>
              <p class="text-sm text-muted mt-2">${esc(itemSummary(o))}</p>
              <p class="text-sm font-semibold mt-1">${peso(orderTotal(o))}</p>
              ${o.status === 'READY' ? servedProgress(o) : ''}
              ${o.staff ? `<p class="text-xs text-muted mt-1">Handled by ${esc(o.staff)}</p>` : ''}
            </div>
          </article>
        `).join('')}
      </div>
    ` : `
      <div class="mt-6">${emptyState('clipboard-list','No orders yet','Orders placed by floor waiters will appear here in real time.')}</div>
    `}`;
  }

  /* ===== MODAL & ACTION HANDLERS ===== */
  function openMenuItemModal(id){
    const item = id ? S.state.menu.find(m => m.id === id) : {
      name: '', category: 'Main Dish', description: '', ingredients: '',
      price: 0, emoji: '🍽️', image: '', available: true
    };
    if(id && !item) return;

    S.openModal(`
    <div class="p-6 md:p-7 max-w-xl">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs font-bold uppercase tracking-[.14em]" style="color:var(--primary)">${id ? 'Edit Dish' : 'New Dish'}</p>
          <h2 class="font-serif text-2xl font-bold mt-1">${id ? 'Update Menu Item' : 'Add to Menu'}</h2>
        </div>
        <button class="btn btn-ghost !p-2" onclick="Savor.closeModal()">${icon('x','w-4 h-4')}</button>
      </div>

      <form class="space-y-4 mt-5" onsubmit="event.preventDefault();SA.saveMenuItem('${id || ''}')">
        <label class="block text-sm font-semibold">Dish Name *
          <input id="m-name" required class="field mt-1.5" placeholder="e.g. Crispy Pork Belly" value="${esc(item.name)}">
        </label>

        <div class="grid grid-cols-2 gap-3">
          <label class="block text-sm font-semibold">Category
            <select id="m-category" class="field mt-1.5">
              ${['Appetizer','Main Dish','Dessert','Drinks'].map(c => `<option ${item.category === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </label>
          <label class="block text-sm font-semibold">Price (₱) *
            <input id="m-price" type="number" min="0" step="1" required class="field mt-1.5" placeholder="250" value="${item.price || ''}">
          </label>
        </div>

        <label class="block text-sm font-semibold">Description
          <textarea id="m-description" rows="2" class="field mt-1.5" placeholder="Short appetizing description...">${esc(item.description)}</textarea>
        </label>

        <label class="block text-sm font-semibold">Ingredients
          <input id="m-ingredients" class="field mt-1.5" placeholder="e.g. Pork belly, garlic, peppercorn, vinegar" value="${esc(item.ingredients)}">
        </label>

        <div class="grid grid-cols-2 gap-3">
          <label class="block text-sm font-semibold">Emoji Icon
            <input id="m-emoji" class="field mt-1.5 text-center text-lg" placeholder="🍗" value="${esc(item.emoji)}">
          </label>
          <label class="block text-sm font-semibold">Image URL (Optional)
            <input id="m-image" class="field mt-1.5" placeholder="https://..." value="${esc(item.image)}">
          </label>
        </div>

        <label class="flex items-center gap-3 py-2 cursor-pointer">
          <input id="m-available" type="checkbox" ${item.available ? 'checked' : ''} class="w-4 h-4 accent-[#B44A26] rounded">
          <span class="text-sm font-semibold">Available for customers &amp; waiters to order</span>
        </label>

        <div class="flex gap-2.5 pt-2">
          <button type="button" class="btn btn-ghost flex-1" onclick="Savor.closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary flex-1">${id ? 'Save Changes' : 'Add to Menu'}</button>
        </div>
      </form>
    </div>`);
  }

  async function saveMenuItem(id){
    const name = document.getElementById('m-name').value.trim();
    if(!name){ S.toast('Dish name is required.'); return; }
    const item = {
      id: id || S.uid(),
      name,
      category: document.getElementById('m-category').value,
      description: document.getElementById('m-description').value.trim(),
      ingredients: document.getElementById('m-ingredients').value.trim(),
      price: Number(document.getElementById('m-price').value) || 0,
      emoji: document.getElementById('m-emoji').value.trim() || '🍽️',
      image: document.getElementById('m-image').value.trim(),
      available: document.getElementById('m-available').checked
    };
    await S.Data.saveMenuItem(item);
    S.closeModal();
    S.toast(id ? 'Menu item updated ✓' : 'New dish added to menu ✓');
    render();
  }

  function deleteMenuItemConfirm(id){
    const item = S.state.menu.find(m => m.id === id);
    if(!item) return;
    S.openModal(`
      <div class="p-7 text-center">
        <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" style="background:var(--danger-soft);color:var(--danger)">
          ${icon('triangle-alert','w-6 h-6')}
        </div>
        <h2 class="font-serif text-2xl font-bold mt-4">Delete "${esc(item.name)}"?</h2>
        <p class="text-sm text-muted mt-2">This dish will be removed from the menu across all staff devices.</p>
        <div class="flex gap-3 mt-6">
          <button class="btn btn-ghost flex-1" onclick="Savor.closeModal()">Cancel</button>
          <button class="btn btn-danger flex-1" onclick="SA.confirmDelete('${id}')">Yes, Delete</button>
        </div>
      </div>
    `);
  }

  async function confirmDelete(id){
    S.closeModal();
    await S.Data.deleteMenuItem(id);
    S.toast('Dish removed from menu.');
    render();
  }

  function render(){
    const map = { menu: viewMenu, orders: viewOrders };
    const fn = map[S.screen] || viewMenu;
    const titles = { menu: 'Menu Manager', orders: 'Live Orders' };
    const eyebrow = document.getElementById('screen-eyebrow');
    const title = document.getElementById('screen-title');
    if(eyebrow) eyebrow.textContent = 'SEMI ADMIN';
    if(title) title.textContent = titles[S.screen] || 'Menu';
    setHtml(document.getElementById('main'), fn());
    document.getElementById('main')?.firstElementChild?.classList.add('screen-enter');
  }

  window.SA = {
    setFilter,
    openMenuItemModal,
    saveMenuItem,
    deleteMenuItemConfirm,
    confirmDelete
  };

  /* ===== Entry — Protected by Semi Admin Credentials ===== */
  const session = S.requireRole('semi_admin');
  if(session){
    startApp(session);
  }
})();
</script>
</body>
</html>
