<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121110">
  <title>Food &amp; Beverage — Floor Manager Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet">
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bg: 'var(--bg)', surface: 'var(--surface)', 'surface-2': 'var(--surface-2)', 'surface-3': 'var(--surface-3)', border: 'var(--border)', ink: 'var(--ink)', muted: 'var(--text-muted)', primary: 'var(--primary)' } } } };</script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="shared.js"></script>
</head>

<body class="bg-bg text-ink">
  <div id="app"></div>

  <script>
    (function () {
      const S = window.Savor;
      const session = S.requireRole('semi_admin');
      if (!session) return;
      S.session = session;

      const { $, esc, icon, peso, toast, setHtml, statusPill, paymentPill, orderTotal, hasMeta, orderMetaText,
        tableTag, itemCount, readyCount, unreadyCount, servedCount, itemSummary, menuHero, processImageFile, fmtTime } = S;

      let currentCategory = 'All';
      let searchQuery = '';
      let activeImageUpload = '';

      let ordersDayFilter = 'TODAY'; // 'TODAY', 'YESTERDAY', 'CUSTOM', 'ALL'
      let ordersCustomDate = S.fmtDateKey(Date.now());
      let ordersStatusFilter = 'ALL'; // 'ALL', 'ACTIVE', 'COMPLETED'

      function filterOrdersByDay(list, filterType, customDate) {
        if (filterType === 'ALL') return list;
        const todayKey = S.fmtDateKey(Date.now());
        const yestKey = S.fmtDateKey(Date.now() - 86400000);
        return list.filter(o => {
          const key = S.fmtDateKey(o.createdAt || o.created_at || Date.now());
          if (filterType === 'TODAY') return key === todayKey;
          if (filterType === 'YESTERDAY') return key === yestKey;
          if (filterType === 'CUSTOM') return key === customDate;
          return true;
        });
      }

      const NAV_ITEMS = [
        { key: 'menu', label: 'Menu &amp; Dish Photos', icon: 'utensils' },
        { key: 'orders', label: 'Floor Orders Log', icon: 'receipt' }
      ];

      function render() {
        const app = document.getElementById('app');
        if (!app) return;

        const activeOrders = S.state.orders.filter(o => (o.status !== 'COMPLETED' || o.payment !== 'PAID') && S.isToday(o.createdAt));
        NAV_ITEMS[1].badge = activeOrders.length || '';

        let content = '';
        if (S.currentScreen === 'orders') content = renderFloorOrders();
        else content = renderMenuManager();

        setHtml(app, `
      ${S.renderNav('Floor Manager Portal', S.currentScreen, NAV_ITEMS)}
      <main class="max-w-7xl mx-auto px-4 py-6">
        ${content}
      </main>
    `);
      }

      /* ====================================================================
         1. MENU & DISH MANAGEMENT WITH PHOTOS
         ==================================================================== */
      function renderMenuManager() {
        const categories = ['All', 'Appetizer', 'Main Dish', 'Dessert', 'Drinks'];
        const q = searchQuery.trim().toLowerCase();

        const filtered = S.state.menu.filter(m => {
          const matchCat = (currentCategory === 'All' || m.category === currentCategory);
          const matchSearch = !q || m.name.toLowerCase().includes(q) || (m.ingredients || '').toLowerCase().includes(q);
          return matchCat && matchSearch;
        });

        return `
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div>
          <h2 class="font-serif text-2xl md:text-3xl font-bold tracking-tight">Menu Manager &amp; Dish Photos</h2>
          <p class="text-xs sm:text-sm text-muted mt-0.5">Add dishes with high-res photos, adjust prices, and toggle 86 availability.</p>
        </div>
        <button class="btn btn-primary" onclick="window.openDishModal()">
          ${icon('plus', 'w-4 h-4')} Add New Dish
        </button>
      </div>

      <!-- Filters & Search -->
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
          ${categories.map(c => `
            <button class="btn ${currentCategory === c ? 'btn-primary' : 'btn-ghost'} py-1.5 px-3.5 text-xs rounded-full" onclick="window.setCategory('${c}')">
              ${c} (${c === 'All' ? S.state.menu.length : S.state.menu.filter(m => m.category === c).length})
            </button>
          `).join('')}
        </div>
        <div class="w-full sm:w-64">
          <input type="text" class="input py-1.5 px-3 text-xs" placeholder="Search dishes..." value="${esc(searchQuery)}" oninput="window.setSearch(this.value)">
        </div>
      </div>

      <!-- Dish Grid -->
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        ${filtered.map(dish => `
          <div class="card p-4 flex flex-col justify-between group ${!dish.available ? 'opacity-60 border-rose-500/40 bg-rose-500/5' : ''}">
            <div>
              ${menuHero(dish, 'h-40')}

              <div class="flex items-start justify-between gap-2 mb-1">
                <span class="text-xs text-amber-500 font-semibold uppercase tracking-wider">${esc(dish.category)}</span>
                <button class="pill ${dish.available ? 'pill-paid' : 'pill-alert'} cursor-pointer text-[10px]" onclick="window.toggleDish('${dish.id}')" title="Click to toggle availability">
                  ${dish.available ? 'Available' : '86 / Sold Out'}
                </button>
              </div>

              <h4 class="font-bold text-base mt-1 group-hover:text-amber-500 transition-colors">${esc(dish.name)}</h4>
              <p class="text-xs text-muted mt-1 line-clamp-2">${esc(dish.description || 'No description.')}</p>
            </div>

            <div class="pt-3 mt-4 border-t border-border flex items-center justify-between">
              <strong class="text-base font-bold text-ink">${peso(dish.price)}</strong>
              <div class="flex items-center gap-1">
                <button class="icon-btn w-7 h-7 text-xs" onclick="window.openDishModal('${dish.id}')" title="Edit Dish &amp; Photo">
                  ${icon('pencil', 'w-3.5 h-3.5')}
                </button>
                <button class="icon-btn w-7 h-7 text-xs text-rose-400 hover:bg-rose-500/10" onclick="window.deleteDish('${dish.id}')" title="Delete Dish">
                  ${icon('trash-2', 'w-3.5 h-3.5')}
                </button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      ${filtered.length === 0 ? `<div class="card p-12 text-center text-muted mt-4">No dishes match your filter.</div>` : ''}
    `;
      }

      /* ====================================================================
         2. FLOOR ORDERS & DAILY AUDIT
         ==================================================================== */
      function renderFloorOrders() {
        const allOrders = S.state.orders;
        const dayOrders = filterOrdersByDay(allOrders, ordersDayFilter, ordersCustomDate);

        const filtered = dayOrders.filter(o => {
          if (ordersStatusFilter === 'ACTIVE') return o.status !== 'COMPLETED' || o.payment !== 'PAID';
          if (ordersStatusFilter === 'COMPLETED') return o.status === 'COMPLETED' || o.payment === 'PAID';
          return true; // 'ALL'
        });

        let dayLabel = 'Today';
        if (ordersDayFilter === 'YESTERDAY') dayLabel = 'Yesterday';
        else if (ordersDayFilter === 'CUSTOM') dayLabel = S.fmtDate(new Date(ordersCustomDate).getTime());
        else if (ordersDayFilter === 'ALL') dayLabel = 'All Days';

        return `
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div>
          <h2 class="font-serif text-2xl md:text-3xl font-bold tracking-tight">Floor Orders &amp; Daily Logs</h2>
          <p class="text-xs sm:text-sm text-muted mt-0.5">Live view of kitchen tickets and historical orders filterable per day.</p>
        </div>
        <span class="pill pill-paid text-xs font-semibold">${dayLabel} · ${filtered.length} tickets</span>
      </div>

      <!-- Filter Controls: Day and Status -->
      <div class="card p-3.5 mb-6 bg-surface-2/40 border border-border flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-bold uppercase text-muted flex items-center gap-1.5 mr-1">
            ${icon('calendar', 'w-3.5 h-3.5 text-amber-500')} Day:
          </span>
          <button class="btn ${ordersDayFilter === 'TODAY' ? 'btn-primary' : 'btn-ghost'} py-1 px-3 text-xs rounded-xl" onclick="window.setOrdersDayFilter('TODAY')">
            Today
          </button>
          <button class="btn ${ordersDayFilter === 'YESTERDAY' ? 'btn-primary' : 'btn-ghost'} py-1 px-3 text-xs rounded-xl" onclick="window.setOrdersDayFilter('YESTERDAY')">
            Yesterday
          </button>
          <button class="btn ${ordersDayFilter === 'ALL' ? 'btn-primary' : 'btn-ghost'} py-1 px-3 text-xs rounded-xl" onclick="window.setOrdersDayFilter('ALL')">
            All Days
          </button>
          <input type="date" class="input py-0.5 px-2 text-xs font-mono ml-1" value="${ordersCustomDate}" onchange="window.setOrdersCustomDate(this.value)">
        </div>

        <div class="flex items-center gap-1 bg-surface-2 p-1 rounded-xl border border-border text-xs">
          ${['ACTIVE', 'COMPLETED', 'ALL'].map(st => `
            <button class="btn ${ordersStatusFilter === st ? 'btn-primary' : 'btn-ghost'} py-1 px-2.5 text-xs rounded-lg" onclick="window.setOrdersStatusFilter('${st}')">
              ${st === 'ACTIVE' ? 'Active Floor' : st === 'COMPLETED' ? 'Finished / Paid' : 'All Orders'}
            </button>
          `).join('')}
        </div>
      </div>

      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        ${filtered.map(o => `
          <div class="card p-4 hover:border-border/80 transition-colors">
            <div class="flex justify-between items-start pb-2 border-b border-border">
              <div>
                <strong class="font-mono text-lg">${esc(o.code)}</strong>
                <span class="text-xs text-amber-500 block font-semibold">${esc(orderMetaText(o))}</span>
              </div>
              <div class="flex flex-col items-end gap-1">
                ${statusPill(o.status)}
                ${paymentPill(o)}
              </div>
            </div>
            <div class="py-2.5 text-xs text-muted">
              ${(o.items || []).map(i => `${i.qty}× ${esc(i.name)}`).join(' · ')}
            </div>
            <div class="pt-2 border-t border-border flex justify-between items-center text-xs">
              <span class="font-bold">${peso(orderTotal(o))}</span>
              <span class="text-muted">${S.fmtDateTime(o.createdAt)}</span>
            </div>
          </div>
        `).join('')}
      </div>
      ${filtered.length === 0 ? `<div class="card p-12 text-center text-muted">No orders matching filter for ${dayLabel}.</div>` : ''}
    `;
      }

      /* Dish Modal with Picture Upload for Floor Manager */
      window.openDishModal = (id = null) => {
        const item = id ? S.state.menu.find(m => m.id === id) : null;
        const isEdit = !!item;
        activeImageUpload = item?.image || '';

        S.Modal.open(`
      <div class="p-6 max-w-lg mx-auto">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-serif font-bold text-xl">${isEdit ? 'Edit Dish &amp; Photo' : 'Add New Dish to Menu'}</h3>
          <button class="btn btn-ghost p-1.5" onclick="Savor.Modal.close()">${icon('x', 'w-4 h-4')}</button>
        </div>
        <form id="dish-form" class="space-y-3.5" onsubmit="window.saveDishForm(event, '${id || ''}')">
          <!-- Dish Photo Upload Area -->
          <div>
            <label class="block text-xs font-bold text-muted mb-1.5">Dish Photo / Picture</label>
            <div class="flex items-center gap-4 p-3 bg-surface-2 rounded-xl border border-border">
              <div id="dish-img-preview" class="w-20 h-20 rounded-xl bg-surface-3 overflow-hidden flex items-center justify-center text-3xl flex-shrink-0 border border-border">
                ${activeImageUpload ? `<img src="${esc(activeImageUpload)}" class="w-full h-full object-cover">` : icon('utensils', 'w-8 h-8 text-muted/60')}
              </div>
              <div class="flex-1 space-y-2">
                <div class="flex items-center gap-2">
                  <label class="btn btn-primary py-1.5 px-3 text-xs cursor-pointer">
                    ${icon('camera', 'w-3.5 h-3.5')} Upload Picture
                    <input type="file" accept="image/*" class="hidden" onchange="window.handleImageUpload(event)">
                  </label>
                  ${activeImageUpload ? `<button type="button" class="btn btn-ghost py-1.5 px-2.5 text-xs text-rose-400" onclick="window.clearDishImage()">Remove</button>` : ''}
                </div>
                <input type="text" id="dish-img-url" class="input py-1 text-xs" placeholder="Or paste image URL (https://...)" value="${esc(activeImageUpload)}" oninput="window.setDishImageUrl(this.value)">
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-muted mb-1">Dish Name *</label>
            <input type="text" id="dish-name" required class="input text-xs" value="${esc(item?.name || '')}" placeholder="e.g. Crispy Calamari">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-muted mb-1">Category *</label>
              <select id="dish-category" class="input text-xs">
                ${['Appetizer', 'Main Dish', 'Dessert', 'Drinks'].map(c => `
                  <option value="${c}" ${item?.category === c ? 'selected' : ''}>${c}</option>
                `).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-muted mb-1">Selling Price (₱) *</label>
              <input type="number" id="dish-price" step="0.01" required class="input text-xs" value="${item?.price || ''}" placeholder="280">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-muted mb-1">Description</label>
            <textarea id="dish-desc" rows="2" class="input text-xs" placeholder="Short description of the dish...">${esc(item?.description || '')}</textarea>
          </div>
          <div>
            <label class="block text-xs font-bold text-muted mb-1">Ingredients (comma separated)</label>
            <input type="text" id="dish-ingr" class="input text-xs" value="${esc(item?.ingredients || '')}" placeholder="Garlic, onion, pepper, salt">
          </div>
          <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" id="dish-available" ${item?.available !== false ? 'checked' : ''} class="w-4 h-4 rounded text-amber-500">
            <label for="dish-available" class="text-xs font-bold">Currently in stock &amp; available to order</label>
          </div>
          <div class="flex gap-2 pt-3">
            <button type="submit" class="btn btn-primary flex-1 justify-center">${icon('check', 'w-4 h-4')} Save Dish</button>
            <button type="button" class="btn btn-ghost" onclick="Savor.Modal.close()">Cancel</button>
          </div>
        </form>
      </div>
    `);
      };

      window.handleImageUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          toast('Processing photo...', 1500, 'info');
          const dataUrl = await S.processImageFile(file);
          activeImageUpload = dataUrl;
          const preview = document.getElementById('dish-img-preview');
          const urlInput = document.getElementById('dish-img-url');
          if (preview) preview.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;
          if (urlInput) urlInput.value = dataUrl;
          toast('Photo ready!', 2000, 'success');
        } catch (err) {
          toast('Image error: ' + err.message, 3000, 'alert');
        }
      };

      window.setDishImageUrl = (val) => {
        activeImageUpload = val.trim();
        const preview = document.getElementById('dish-img-preview');
        if (preview) {
          if (activeImageUpload) preview.innerHTML = `<img src="${esc(activeImageUpload)}" class="w-full h-full object-cover" onerror="this.src='';">`;
          else preview.innerHTML = icon('utensils', 'w-8 h-8 text-muted/60');
        }
      };

      window.clearDishImage = () => {
        activeImageUpload = '';
        const preview = document.getElementById('dish-img-preview');
        const urlInput = document.getElementById('dish-img-url');
        if (preview) preview.innerHTML = icon('utensils', 'w-8 h-8 text-muted/60');
        if (urlInput) urlInput.value = '';
      };

      window.saveDishForm = async (e, id) => {
        e.preventDefault();
        const name = document.getElementById('dish-name').value.trim();
        const category = document.getElementById('dish-category').value;
        const price = parseFloat(document.getElementById('dish-price').value) || 0;
        const description = document.getElementById('dish-desc').value.trim();
        const ingredients = document.getElementById('dish-ingr').value.trim();
        const available = document.getElementById('dish-available').checked;
        const image = activeImageUpload || document.getElementById('dish-img-url')?.value.trim() || '';

        const dish = {
          id: id || S.uid('dish'),
          name, category, price, description, ingredients, available, image,
          emoji: ''
        };

        await S.Data.saveMenuItem(dish);
        S.Modal.close();
        toast(`Dish "${name}" saved to menu!`, 3000, 'success');
        render();
      };

      /* Interactive Menu Dish Removal Dialog (No browser confirm popup) */
      window.deleteDish = (id) => {
        const dish = S.state.menu.find(m => m.id === id);
        const dishName = dish ? dish.name : 'this menu dish';

        S.Modal.open(`
      <div class="p-6 max-w-sm mx-auto text-center">
        <div class="w-14 h-14 rounded-2xl bg-rose-500/15 text-rose-500 border border-rose-500/30 mx-auto flex items-center justify-center mb-4">
          ${icon('trash-2', 'w-7 h-7 text-rose-500')}
        </div>
        <h3 class="font-serif font-bold text-xl text-ink">Remove Dish from Menu?</h3>
        <p class="text-xs text-muted mt-2 leading-relaxed">
          Are you sure you want to remove <b class="text-ink font-semibold">${esc(dishName)}</b>? This will delete the dish from the restaurant catalog.
        </p>
        <div class="flex gap-2.5 mt-6">
          <button type="button" class="btn btn-ghost flex-1 justify-center py-2 text-xs" onclick="Savor.Modal.close()">
            Cancel
          </button>
          <button type="button" class="btn bg-rose-600 hover:bg-rose-700 text-white font-semibold flex-1 justify-center py-2 text-xs shadow-lg shadow-rose-600/20" onclick="window.confirmDeleteDish('${id}')">
            ${icon('trash-2', 'w-3.5 h-3.5')} Yes, Remove
          </button>
        </div>
      </div>
    `);
      };

      window.confirmDeleteDish = async (id) => {
        await S.Data.deleteMenuItem(id);
        S.Modal.close();
        toast('Menu dish removed successfully.', 2500, 'info');
        render();
      };

      window.setOrdersDayFilter = (f) => { ordersDayFilter = f; render(); };
      window.setOrdersCustomDate = (val) => { ordersDayFilter = 'CUSTOM'; ordersCustomDate = val; render(); };
      window.setOrdersStatusFilter = (st) => { ordersStatusFilter = st; render(); };
      window.setCategory = (cat) => { currentCategory = cat; render(); };
      window.setSearch = (val) => { searchQuery = val; render(); };

      window.toggleDish = async (dishId) => {
        const dish = S.state.menu.find(m => m.id === dishId);
        if (!dish) return;
        dish.available = !dish.available;
        await S.Data.saveMenuItem(dish);
        toast(dish.available ? `${dish.name} marked Available` : `${dish.name} marked 86 / Sold Out`, 2500, dish.available ? 'success' : 'alert');
        render();
      };

      S.boot({ role: 'semi_admin', defaultScreen: 'menu', render: render });
    })();
  </script>
</body>

</html>
