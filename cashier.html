<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#211F1C">
<title>Cashier — Savor &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ bg:'var(--bg)',surface:'var(--surface)',ink:'var(--text)',muted:'var(--text-muted)' }, fontFamily:{ sans:['DM Sans','system-ui','sans-serif'], serif:['Fraunces','Georgia','serif'] } } } };</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const S = window.Savor;
  const session = S.requireRole('cashier');
  if(!session) return;
  S.session = session;

  const { $, esc, icon, peso, toast, setHtml, statusPill, orderTotal, hasMeta, orderMetaText, tableTag,
          itemCount, servedCount, itemSummary, servedProgress, emptyState, fmtTime, fmtDateTime } = S;

  S.navBadge = function(key){
    if(key === 'counter'){
      const n = S.state.orders.filter(o => o.status === 'COMPLETED' && o.payment !== 'PAID').length;
      if(n > 0) return `<span class="nav-badge">${n}</span>`;
    }
    return '';
  };
  S.onRender = function(){ render(); };
  S.onDataChanged = function(ctx){
    const newReady = S.state.orders.filter(o => o.status === 'COMPLETED' && o.payment !== 'PAID' && ctx.beforeStatuses.get(o.id) !== 'COMPLETED');
    if(newReady.length > 0){
      const first = newReady[0];
      const meta = hasMeta(first) ? ` (${orderMetaText(first)})` : '';
      toast(`💰 ${first.code} ready for payment${meta} — ${peso(orderTotal(first))}`, 6000, 'alert');
      if(S.state.sound) S.chime();
    }
  };

  function viewCounter(){
    const awaiting = S.state.orders.filter(o => o.status === 'COMPLETED' && o.payment !== 'PAID').sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    const serving = S.state.orders.filter(o => o.status === 'READY');
    const pending = S.state.orders.filter(o => o.status === 'PENDING' || o.status === 'PREPARING');
    const awaitingTotal = awaiting.reduce((s, o) => s + orderTotal(o), 0);
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">Counter</h2><p class="text-muted text-sm mt-1">Collect payment once the waiter has served every item.</p></div>
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost" onclick="Savor.toggleSound()">${icon(S.state.sound ? 'volume-2' : 'volume-x','w-4 h-4')} ${S.state.sound ? 'Sound on' : 'Muted'}</button>
        ${awaiting.length ? `<span class="pill pill-unpaid">${awaiting.length} awaiting · ${peso(awaitingTotal)}</span>` : `<span class="pill pill-paid">All settled</span>`}
      </div>
    </div>
    <section class="mt-6">
      <h3 class="font-bold text-xs uppercase tracking-[.14em] text-muted mb-3">Awaiting payment · fully served, not paid</h3>
      ${awaiting.length ? `<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${awaiting.map(card).join('')}</div>` : `${emptyState('check-check','No payments pending','Orders the waiter has finished serving will appear here.')}`}
    </section>
    ${serving.length ? `<section class="mt-8"><h3 class="font-bold text-xs uppercase tracking-[.14em] text-muted mb-3">Being served · waiter in progress</h3><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${serving.map(card).join('')}</div></section>` : ''}
    ${pending.length ? `<section class="mt-8"><h3 class="font-bold text-xs uppercase tracking-[.14em] text-muted mb-3">Still cooking</h3><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${pending.map(card).join('')}</div></section>` : ''}`;
  }

  /* ===== PAID ORDERS — responsive cards, grouped by date ===== */
  function groupByDate(orders, key){
    const todayStr = new Date().toDateString();
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toDateString();
    const groups = {};
    orders.forEach(o => {
      const ts = o[key] || o.updatedAt || o.createdAt;
      const d = new Date(ts);
      let label;
      if(d.toDateString() === todayStr) label = 'Today';
      else if(d.toDateString() === yesterdayStr) label = 'Yesterday';
      else label = d.toLocaleDateString('en-PH', { weekday:'short', month:'short', day:'numeric' });
      if(!groups[label]) groups[label] = [];
      groups[label].push(o);
    });
    return groups;
  }

  function paidCard(order){
    const paidAt = order.paidAt || order.updatedAt;
    const items = order.items || [];
    return `
    <article class="card soft overflow-hidden flex flex-col">
      <div class="p-4 flex flex-col flex-1">
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0">
            <p class="font-bold text-lg leading-tight">${esc(order.code)}</p>
            ${hasMeta(order) ? `<div class="mt-1.5">${tableTag(order)}</div>` : ''}
          </div>
          <span class="pill pill-paid !text-[11px] !py-1 !px-2.5 flex-none">
            ${icon('check','w-3 h-3 inline -mt-0.5 mr-0.5')} PAID
          </span>
        </div>
        <div class="mt-3 space-y-1 text-sm flex-1">
          ${items.map(i => `<div class="flex justify-between gap-2">
            <span class="font-semibold truncate">${i.qty} × ${esc(i.name)}</span>
            ${i.price ? `<span class="text-muted text-xs flex-none">${peso(Number(i.price) * i.qty)}</span>` : ''}
          </div>`).join('')}
        </div>
        <div class="flex justify-between items-center mt-3 pt-2 border-t text-sm" style="border-color:var(--border)">
          <div class="text-xs text-muted">
            ${icon('clock','w-3 h-3 inline -mt-0.5 mr-1')}${fmtTime(paidAt)}
            ${order.staff ? ` · ${esc(order.staff)}` : ''}
          </div>
          <strong class="text-base">${peso(orderTotal(order))}</strong>
        </div>
      </div>
    </article>`;
  }

  function viewPaid(){
    const paid = S.state.orders.filter(o => o.payment === 'PAID')
      .sort((a,b) => new Date(b.paidAt || b.updatedAt) - new Date(a.paidAt || a.updatedAt));

    const todayStr = new Date().toDateString();
    const todayPaid = paid.filter(o => o.paidAt && new Date(o.paidAt).toDateString() === todayStr);
    const todayTotal = todayPaid.reduce((s, o) => s + orderTotal(o), 0);
    const allTotal = paid.reduce((s, o) => s + orderTotal(o), 0);

    const groups = groupByDate(paid, 'paidAt');
    const groupKeys = Object.keys(groups);

    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div>
        <h2 class="font-serif text-2xl md:text-3xl font-bold">Paid orders</h2>
        <p class="text-muted text-sm mt-1">${paid.length} order${paid.length === 1 ? '' : 's'} settled${todayPaid.length ? ` · ${todayPaid.length} today · ${peso(todayTotal)}` : ''}</p>
      </div>
      <button class="btn btn-ghost" onclick="Savor.refreshNow()">${icon('refresh-cw','w-4 h-4')} Refresh</button>
    </div>

    <div class="grid sm:grid-cols-2 gap-4 mt-5">
      <article class="card soft p-5">
        <div class="flex justify-between items-start">
          <span class="text-sm text-muted">Revenue today</span>
          <span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--success-soft);color:var(--success)">${icon('banknote','w-4 h-4')}</span>
        </div>
        <strong class="block text-3xl mt-4">${peso(todayTotal)}</strong>
        <small class="text-muted">${todayPaid.length} order${todayPaid.length === 1 ? '' : 's'}</small>
      </article>
      <article class="card soft p-5">
        <div class="flex justify-between items-start">
          <span class="text-sm text-muted">All-time revenue</span>
          <span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--primary-soft);color:var(--primary)">${icon('trending-up','w-4 h-4')}</span>
        </div>
        <strong class="block text-3xl mt-4">${peso(allTotal)}</strong>
        <small class="text-muted">${paid.length} order${paid.length === 1 ? '' : 's'}</small>
      </article>
    </div>

    ${!paid.length ? `<div class="mt-6">${emptyState('receipt','No paid orders yet','Completed payments will appear here grouped by date.')}</div>` : ''}

    ${groupKeys.map(groupLabel => {
      const orders = groups[groupLabel];
      const groupTotal = orders.reduce((s, o) => s + orderTotal(o), 0);
      return `
        <section class="mt-6">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-xs uppercase tracking-[.14em] text-muted">${groupLabel}</h3>
            <span class="text-xs text-muted">${orders.length} order${orders.length === 1 ? '' : 's'} · ${peso(groupTotal)}</span>
          </div>
          <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3 md:gap-4">
            ${orders.map(paidCard).join('')}
          </div>
        </section>`;
    }).join('')}`;
  }

  function viewSettings(){
    return `
    <h2 class="font-serif text-2xl md:text-3xl font-bold">Cashier settings</h2>
    <div class="grid md:grid-cols-2 gap-5 mt-6 max-w-4xl">
      <section class="card soft p-5"><h3 class="font-bold">Display preferences</h3><div class="mt-2">
        <div class="flex items-center justify-between gap-4 py-4 border-t" style="border-color:var(--border)"><div><span class="font-semibold text-sm block">Dark mode</span></div><button class="toggle ${S.state.dark ? 'on' : ''}" onclick="Savor.toggleTheme()"><span></span></button></div>
        <div class="flex items-center justify-between gap-4 py-4 border-t" style="border-color:var(--border)"><div><span class="font-semibold text-sm block">Order sound</span></div><button class="toggle ${S.state.sound ? 'on' : ''}" onclick="Savor.toggleSound()"><span></span></button></div>
      </div></section>
      <section class="card soft p-5">
        <h3 class="font-bold">Data source</h3>
        <div class="rounded-xl p-4 mt-4" style="background:var(--${S.state.net === 'sheets' ? 'success-soft' : S.state.net === 'offline' ? 'danger-soft' : 'warn-soft'});color:var(--${S.state.net === 'sheets' ? 'success' : S.state.net === 'offline' ? 'danger' : 'warn'})">
          <strong>${S.state.net === 'sheets' ? 'Live — reading from Google Sheets' : S.state.net === 'offline' ? 'Google Sheets unreachable — retrying automatically' : 'Local demo mode'}</strong>
        </div>
        <button class="btn btn-ghost mt-4" onclick="Savor.refreshNow()">${icon('refresh-cw','w-4 h-4')} Refresh now</button>
      </section>
    </div>`;
  }

  function card(order){
    const total = orderTotal(order);
    const isServed = order.status === 'COMPLETED';
    const isPaid = order.payment === 'PAID';
    const isBeingServed = order.status === 'READY';
    return `
    <article class="card soft overflow-hidden border-t-4 flex flex-col" style="border-top-color:${isServed ? (isPaid ? 'var(--success)' : 'var(--warn)') : 'var(--primary)'}">
      <div class="p-5 flex flex-col flex-1">
        <div class="flex justify-between items-start gap-3">
          <div class="min-w-0">
            <p class="font-bold text-xl leading-none">${esc(order.code)}</p>
            ${hasMeta(order) ? `<div class="mt-2">${tableTag(order)}</div>` : ''}
            <p class="text-xs font-semibold mt-2 text-muted">${esc(order.staff || 'Waiter')} · ${fmtTime(order.createdAt)}</p>
          </div>
          ${statusPill(order.status)}
        </div>
        <div class="mt-4 space-y-1.5 flex-1 text-sm">
          ${order.items.map(i => `<div class="flex justify-between gap-2">
            <span class="font-semibold ${i.served ? '' : 'text-muted'}">${i.served ? icon('check','w-3 h-3 inline -mt-0.5 mr-1') : ''}${i.qty} × ${esc(i.name)}</span>
            ${i.price ? `<span class="text-muted">${peso(Number(i.price) * i.qty)}</span>` : ''}
          </div>`).join('')}
        </div>
        ${isBeingServed ? servedProgress(order) : ''}
        <div class="flex justify-between items-center mt-4 pt-3 border-t" style="border-color:var(--border)"><span class="text-sm text-muted">Total</span><strong class="text-lg">${peso(total)}</strong></div>
        ${isServed && !isPaid ? `<button class="btn btn-primary w-full mt-4" onclick="CT.markPaid('${order.id}')">${icon('banknote','w-4 h-4')} Mark as paid</button>`
        : isPaid ? `<div class="mt-4 text-center py-3 rounded-xl text-sm font-bold" style="background:var(--success-soft);color:var(--success)">${icon('check','w-4 h-4 inline -mt-0.5 mr-1')} Paid · ${order.paidAt ? fmtDateTime(order.paidAt) : ''}</div>`
        : isBeingServed ? `<div class="mt-4 text-center py-3 rounded-xl text-sm font-bold" style="background:var(--success-soft);color:var(--success)">${servedCount(order)} of ${itemCount(order)} items served</div>`
        : `<div class="mt-4 text-center py-3 rounded-xl text-sm font-bold" style="background:var(--surface-2);color:var(--text-muted)">Awaiting service</div>`}
      </div>
    </article>`;
  }

  function render(){
    const map = { counter: viewCounter, paid: viewPaid, settings: viewSettings };
    const fn = map[S.screen] || viewCounter;
    const titles = { counter:'Counter', paid:'Paid orders', settings:'Cashier settings' };
    document.getElementById('screen-eyebrow').textContent = 'FRONT OF HOUSE';
    document.getElementById('screen-title').textContent = titles[S.screen] || 'Counter';
    setHtml(document.getElementById('main'), fn());
    document.getElementById('main').firstElementChild?.classList.add('screen-enter');
    S._renderNav();
    S.setNet(S.state.net);
    const awaiting = S.state.orders.filter(o => o.status === 'COMPLETED' && o.payment !== 'PAID').length;
    document.title = awaiting > 0 ? `(${awaiting}) Cashier — Savor` : 'Cashier — Savor & Co.';
  }

  async function markPaid(id){
    const order = S.state.orders.find(o => o.id === id); if(!order) return;
    if(order.status !== 'COMPLETED'){ S.toast('Only fully served orders can be paid.'); return; }
    if(order.payment === 'PAID'){ S.toast('Already paid.'); return; }
    await S.Data.markPaid(id);
    S.toast(`${order.code} marked as paid · ${peso(orderTotal(order))} ✓`);
    if(S.state.sound) S.chime();
    render();
  }

  window.CT = { markPaid };

  S.boot({ role: 'cashier', defaultScreen: 'counter', render });
})();
</script>
</body>
</html>
