<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#211F1C">
<title>Waiter — Savor &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ bg:'var(--bg)',surface:'var(--surface)',ink:'var(--text)',muted:'var(--text-muted)' }, fontFamily:{ sans:['DM Sans','system-ui','sans-serif'], serif:['Fraunces','Georgia','serif'] } } } };</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const S = window.Savor;
  const session = S.requireRole('waiter');
  if(!session) return;
  S.session = session;

  const { $, esc, icon, peso, toast, setHtml, statusPill, paymentPill, orderTotal, hasMeta, orderMetaText,
          tableTag, tableLine, itemCount, servedCount, readyCount, unreadyCount, readyUnservedCount, allServed,
          itemSummary, allNotes, servedProgress, emptyState, artClass, menuHero, fmtTime, CATEGORIES } = S;

  let cart = [];
  let cartTable = '';
  let cartCustomer = '';
  let search = '';
  let filter = 'All';
  let availableOnly = false;
  let busy = false;
  let picker = { id:null, qty:1, note:'' };

  function pendingReady(){ return S.state.orders.filter(o => o.status === 'READY' && readyUnservedCount(o) > 0); }

  S.navBadge = function(key){
    if(key === 'ready'){ const n = pendingReady().length; if(n > 0) return `<span class="nav-badge">${n}</span>`; }
    return '';
  };
  S.onRender = function(){ render(); };
  S.onDataChanged = function(ctx){
    const notes = [];
    S.state.orders.forEach(o => {
      if(o.status !== 'READY') return;
      const before = ctx.beforeReadyUnserved.get(o.id);
      if(before === undefined) return;
      const now = readyUnservedCount(o);
      if(now > before) notes.push({ order: o, count: now - before });
    });
    if(notes.length > 0){
      const first = notes[0];
      const meta = hasMeta(first.order) ? ` (${orderMetaText(first.order)})` : '';
      const suffix = notes.length > 1 ? ` · +${notes.length - 1} more` : '';
      toast(`🔔 ${first.order.code} — ${first.count} item${first.count === 1 ? '' : 's'} ready${meta}${suffix} — tap Ready to serve`, 7000, 'alert');
      if(S.state.sound) S.chime();
    }
  };

  function filteredMenu(){
    const q = search.trim().toLowerCase();
    return S.state.menu.filter(m =>
      (filter === 'All' || m.category === filter) &&
      (!availableOnly || m.available) &&
      (!q || m.name.toLowerCase().includes(q) || (m.description || '').toLowerCase().includes(q) || (m.ingredients || '').toLowerCase().includes(q))
    );
  }
  function categoryChips(){
    return CATEGORIES.map(c => `<button class="pill ${filter === c ? 'pill-preparing' : 'pill-completed'}" onclick="WT.setFilter('${c}')">${c}</button>`).join('');
  }

  function viewMenu(){
    const cartCount = cart.reduce((a, c) => a + c.qty, 0);
    const total = cart.reduce((s, c) => s + ((Number(c.price) || 0) * (Number(c.qty) || 0)), 0);
    const ready = pendingReady();
    return `
    ${ready.length ? `<button class="ready-banner w-full text-left" onclick="Savor.navigate('ready')"><span class="pulse-dot"></span><span class="flex-1">${ready.length} order${ready.length === 1 ? '' : 's'} with items ready to serve — tap to open</span>${icon('arrow-right','w-4 h-4')}</button>` : ''}
    <div class="card soft p-4 md:p-5 flex flex-wrap items-center gap-3 sticky top-16 z-10 mb-5">
      <div class="flex items-center gap-2">
        <span class="w-10 h-10 rounded-xl flex items-center justify-center flex-none" style="background:var(--primary-soft);color:var(--primary)">${icon('concierge-bell','w-5 h-5')}</span>
        <div class="text-sm"><span class="block text-xs text-muted font-semibold">New order</span><span class="font-bold text-base">Tap food to add</span></div>
      </div>
      <div class="flex-1"></div>
      <button class="btn btn-dark" onclick="WT.openCart()">${icon('shopping-bag','w-4 h-4')} Order${cartCount ? ` <span class="ml-1 px-2 py-0.5 rounded-full text-xs" style="background:var(--primary);color:var(--on-primary)">${cartCount} · ${peso(total)}</span>` : ''}</button>
    </div>
    <div class="flex flex-wrap gap-2 mb-4">${categoryChips()}</div>
    <div class="flex gap-3 mb-5">
      <input class="field flex-1" placeholder="Search menu" value="${esc(search)}" oninput="WT.setSearch(this.value)">
      <button class="btn ${availableOnly ? 'btn-primary' : 'btn-ghost'}" onclick="WT.toggleAvailable()">${availableOnly ? 'Available ✓' : 'Available only'}</button>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-2 xl:grid-cols-3 gap-3 md:gap-4">
      ${filteredMenu().map(item => {
        const disabled = !item.available;
        return `<article class="card soft overflow-hidden flex flex-col ${disabled ? 'opacity-60' : ''}">
          <button class="w-full text-left" ${disabled ? 'disabled' : `onclick="WT.openItemPicker('${item.id}')"`}>${menuHero(item, 'h-32', 'text-6xl')}</button>
          <div class="p-4 flex flex-col flex-1">
            <div class="flex justify-between items-start gap-2">
              <div class="min-w-0"><h3 class="font-bold text-sm">${esc(item.name)}</h3><p class="text-[11px] text-muted mt-0.5">${esc(item.category)}</p></div>
              ${!item.available ? `<span class="pill pill-completed">Sold out</span>` : ''}
            </div>
            <p class="text-xs text-muted mt-2 flex-1 line-clamp-2">${esc(item.description || '')}</p>
            <div class="flex items-center justify-between gap-2 mt-3">
              <strong class="text-base" style="color:var(--primary)">${peso(item.price)}</strong>
              <button class="btn btn-primary !py-2 !px-3" ${disabled ? 'disabled' : `onclick="WT.openItemPicker('${item.id}')"`}>${icon('plus','w-4 h-4')} Add</button>
            </div>
          </div>
        </article>`;
      }).join('') || `<div class="col-span-full card soft p-10 text-center text-muted">No items match your search.</div>`}
    </div>
    ${cartCount ? `<button class="fab" onclick="WT.openCart()">${icon('shopping-bag','w-5 h-5')}<span>${cartCount} item${cartCount === 1 ? '' : 's'} · ${peso(total)}</span></button>` : ''}`;
  }

  function viewReady(){
    const ready = S.state.orders.filter(o => o.status === 'READY');
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">Ready to serve</h2><p class="text-muted text-sm mt-1">Tap Serve on each ready item as you deliver it. The order closes once everything is served.</p></div>
      <span class="pill ${ready.length ? 'pill-ready' : 'pill-completed'}">${ready.length} order${ready.length === 1 ? '' : 's'}</span>
    </div>
    ${ready.length ? `<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 mt-5">${ready.map(readyTicket).join('')}</div>`
      : `<div class="mt-6">${emptyState('bell','Nothing waiting','When the kitchen marks an item ready, it will pop up here.')}</div>`}`;
  }

  function readyTicket(order){
    const ru = readyUnservedCount(order);
    const sc = unreadyCount(order);
    const done = allServed(order);
    return `
    <article class="card soft overflow-hidden border-t-4 flex flex-col" style="border-top-color:var(--success)">
      <div class="p-5 flex flex-col flex-1">
        <div class="flex justify-between items-start gap-3">
          <div class="min-w-0">
            <p class="font-bold text-xl leading-none">${esc(order.code)}</p>
            ${hasMeta(order) ? `<div class="mt-2">${tableTag(order)}</div>` : ''}
            <p class="text-xs font-semibold mt-2 text-muted">Ready at ${fmtTime(order.updatedAt)}</p>
          </div>
          ${statusPill('READY')}
        </div>
        ${servedProgress(order)}
        <div class="mt-3 space-y-1.5 flex-1">
          ${order.items.map((i, idx) => {
            const cls = i.served ? 'is-served' : (i.ready ? 'is-ready' : 'is-cooking');
            return `<div class="item-row ${cls}">
              <span class="item-check">${(i.served || i.ready) ? icon('check','w-3 h-3') : ''}</span>
              <div class="flex-1 min-w-0">
                <div class="item-name text-sm font-semibold">${i.qty} × ${esc(i.name)}</div>
                ${i.note ? `<div class="text-xs text-muted mt-0.5">Note: ${esc(i.note)}</div>` : ''}
                ${i.served && i.servedAt ? `<div class="text-[10px] mt-0.5" style="color:var(--success)">Served ${fmtTime(i.servedAt)}</div>` : (i.ready && !i.served ? `<div class="text-[10px] mt-0.5" style="color:var(--success)">Ready to deliver</div>` : `<div class="text-[10px] mt-0.5 text-muted">Still cooking...</div>`)}
              </div>
              ${!i.served && i.ready ? `<button class="btn btn-success !py-1.5 !px-3 !text-xs" onclick="WT.serveItem('${order.id}', ${idx})">${icon('check','w-3 h-3')} Serve</button>` : ''}
            </div>`;
          }).join('')}
        </div>
        ${done ? `<div class="mt-4 text-center py-3 rounded-xl text-sm font-bold" style="background:var(--success-soft);color:var(--success)">${icon('check','w-4 h-4 inline -mt-0.5 mr-1')} All items served · sent to cashier</div>`
        : ru > 0 ? `<button class="btn btn-success w-full mt-4" onclick="WT.serveAllReady('${order.id}')">${icon('check-check','w-4 h-4')} Serve all ready items (${ru})</button>${sc > 0 ? `<p class="text-[11px] text-muted text-center mt-2">${sc} item${sc === 1 ? '' : 's'} still cooking — order stays open</p>` : ''}`
        : sc > 0 ? `<div class="mt-4 text-center py-3 rounded-xl text-sm" style="background:var(--surface-2);color:var(--text-muted)">Waiting on kitchen to finish ${sc} item${sc === 1 ? '' : 's'}</div>` : ''}
      </div>
    </article>`;
  }

  function viewOrders(){
    const list = S.state.orders.slice(0, 40);
    return `
    <div class="flex flex-wrap justify-between items-end gap-3">
      <div><h2 class="font-serif text-2xl md:text-3xl font-bold">My orders</h2><p class="text-muted text-sm mt-1">All the orders you have sent to the kitchen.</p></div>
      <button class="btn btn-ghost" onclick="Savor.refreshNow()">${icon('refresh-cw','w-4 h-4')} Refresh</button>
    </div>
    ${list.length ? `<div class="grid gap-4 mt-5">
      ${list.map(o => `<article class="card soft p-5 flex flex-wrap justify-between gap-4">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-3 flex-wrap"><h3 class="font-bold text-lg">${esc(o.code)}</h3>${statusPill(o.status)}${paymentPill(o)}</div>
          ${tableLine(o)}
          <p class="mt-2 text-xs text-muted">Sent ${fmtTime(o.createdAt)}</p>
          <p class="text-sm text-muted mt-2">${esc(itemSummary(o))}</p>
          <p class="text-sm font-semibold mt-1">${peso(orderTotal(o))}</p>
          ${o.status === 'READY' ? servedProgress(o) : ''}
        </div>
        <div class="flex items-end gap-2">
          ${o.status === 'READY' && readyUnservedCount(o) > 0 ? `<button class="btn btn-primary" onclick="Savor.navigate('ready')">${icon('bell','w-4 h-4')} Open Ready to serve</button>` : ''}
        </div>
      </article>`).join('')}
    </div>` : `<div class="mt-6">${emptyState('clipboard-list','No orders yet','Once you send an order it will appear here.')}<div class="text-center mt-6"><button class="btn btn-primary" onclick="Savor.navigate('menu')">${icon('utensils-crossed','w-4 h-4')} Take an order</button></div></div>`}`;
  }

  function viewHelp(){
    return `
    <div class="max-w-2xl mx-auto">
      <div class="text-center">
        <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center" style="background:var(--primary);color:var(--on-primary)">${icon('concierge-bell','w-7 h-7')}</div>
        <h2 class="font-serif text-2xl md:text-3xl font-bold mt-5">How taking an order works</h2>
        <p class="text-muted text-sm mt-2">Each dish flows individually — kitchen marks ready, you serve</p>
      </div>
      <section class="card soft p-6 mt-6">
        <ol class="space-y-4 text-sm">
          ${[
            ['Set the table','Open the cart and enter Table # (required) and Customer name (optional).'],
            ['Tap a dish','Tap a food card to set quantity and add a note for the chef.'],
            ['Send to kitchen','Press Send to kitchen. Kitchen must accept before cooking starts.'],
            ['Kitchen cooks','Kitchen marks each dish ready as it finishes. First ready dish signals you.'],
            ['Serve ready items','Tap Serve on each ready item. The order stays open until every item is served.'],
            ['Order closes','Once everything is served, the order auto-moves to the cashier as Unpaid.']
          ].map(([t,d], i) => `<li class="flex gap-3"><span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold flex-none" style="background:var(--primary-soft);color:var(--primary)">${i+1}</span><div><strong class="block">${t}</strong><span class="text-muted">${d}</span></div></li>`).join('')}
        </ol>
      </section>
    </div>`;
  }

  function render(){
    const map = { menu: viewMenu, ready: viewReady, orders: viewOrders, help: viewHelp };
    const fn = map[S.screen] || viewMenu;
    const titles = { menu:'Take order', ready:'Ready to serve', orders:'My orders', help:'Help' };
    document.getElementById('screen-eyebrow').textContent = 'FLOOR SERVICE';
    document.getElementById('screen-title').textContent = titles[S.screen] || 'Take order';
    setHtml(document.getElementById('main'), fn());
    document.getElementById('main').firstElementChild?.classList.add('screen-enter');
    S._renderNav();
    S.setNet(S.state.net);
    const ready = pendingReady().length;
    document.title = ready > 0 ? `(${ready}) Waiter — Savor` : 'Waiter — Savor & Co.';
  }

  function setSearch(v){ search = v; render(); }
  function setFilter(c){ filter = c; render(); }
  function toggleAvailable(){ availableOnly = !availableOnly; render(); }

  function openItemPicker(id){
    const item = S.state.menu.find(m => m.id === id); if(!item) return;
    picker = { id, qty:1, note:'' };
    const heroHtml = item.image
      ? `<div class="min-h-44 md:min-h-full relative overflow-hidden"><img src="${esc(item.image)}" class="absolute inset-0 w-full h-full object-cover" alt=""></div>`
      : `<div class="art ${artClass(item.category)} min-h-44 md:min-h-full flex items-center justify-center text-7xl">${item.emoji || '🍽️'}</div>`;
    S.openModal(`
    <div class="grid md:grid-cols-2">
      ${heroHtml}
      <div class="p-6">
        <div class="flex justify-between items-start">
          <span class="pill pill-preparing">${esc(item.category)}</span>
          <button class="btn btn-ghost !p-2" onclick="Savor.closeModal()" aria-label="Close">${icon('x','w-4 h-4')}</button>
        </div>
        <h2 class="font-serif font-bold text-2xl mt-3">${esc(item.name)}</h2>
        <p class="text-sm text-muted mt-2">${esc(item.description || '')}</p>
        ${item.ingredients ? `<p class="text-xs text-muted mt-2"><strong style="color:var(--text)">Ingredients:</strong> ${esc(item.ingredients)}</p>` : ''}
        <p class="font-bold text-xl mt-3" style="color:var(--primary)">${peso(item.price)}</p>
        <div class="flex items-center gap-4 mt-6">
          <span class="font-bold text-sm">Quantity</span>
          <button class="w-10 h-10 rounded-full border font-bold text-lg" style="border-color:var(--border)" onclick="WT.pickerQty(-1)">−</button>
          <strong id="picker-qty" class="text-lg w-6 text-center">1</strong>
          <button class="w-10 h-10 rounded-full border font-bold text-lg" style="border-color:var(--border)" onclick="WT.pickerQty(1)">+</button>
        </div>
        <label class="block mt-5 text-sm font-bold">Note for the chef
          <textarea id="picker-note" maxlength="120" class="field mt-2" placeholder="e.g. no onions, serve last"></textarea>
        </label>
        <div class="flex justify-between items-center mt-4 p-3 rounded-xl" style="background:var(--surface-2)">
          <span class="text-sm text-muted">Subtotal</span><strong id="picker-total" class="text-lg">${peso(item.price)}</strong>
        </div>
        <button class="btn btn-primary w-full mt-4" onclick="WT.pickerAdd()">Add to order</button>
      </div>
    </div>`);
  }
  function pickerQty(n){
    picker.qty = Math.max(1, Math.min(50, picker.qty + n));
    const el = document.getElementById('picker-qty'); if(el) el.textContent = picker.qty;
    const item = S.state.menu.find(m => m.id === picker.id);
    if(item){ const t = document.getElementById('picker-total'); if(t) t.textContent = peso((Number(item.price) || 0) * picker.qty); }
  }
  function pickerAdd(){
    const item = S.state.menu.find(m => m.id === picker.id); if(!item) return;
    const note = (document.getElementById('picker-note')?.value || '').trim();
    const existing = cart.find(c => c.id === item.id && c.note === note);
    if(existing) existing.qty += picker.qty;
    else cart.push({ lineId: S.uid(), id: item.id, name: item.name, qty: picker.qty, note, price: Number(item.price) || 0 });
    S.closeModal(); S.toast(`Added ${item.name} ✓`); render();
  }

  function openCart(){
    const drawer = document.getElementById('drawer');
    const count = cart.reduce((a, c) => a + c.qty, 0);
    const total = cart.reduce((s, c) => s + ((Number(c.price) || 0) * (Number(c.qty) || 0)), 0);
    const metaPreview = [String(cartTable || '').trim() ? 'Table ' + cartTable.trim() : '', String(cartCustomer || '').trim() ? cartCustomer.trim() : ''].filter(Boolean).join(' · ');
    drawer.innerHTML = `
    <div class="flex flex-col h-full">
      <div class="flex justify-between items-start p-5 border-b" style="border-color:var(--border)">
        <div class="min-w-0">
          <p class="text-xs font-bold uppercase tracking-[.14em]" style="color:var(--primary)">New order</p>
          <h2 class="font-serif text-xl font-bold">Current order</h2>
          ${metaPreview ? `<p class="text-xs mt-1 font-semibold" style="color:var(--warn)">${esc(metaPreview)}</p>` : ''}
        </div>
        <button class="btn btn-ghost !p-2" onclick="Savor.closeDrawer()">${icon('x','w-4 h-4')}</button>
      </div>
      ${cart.length ? `
        <div class="px-5 py-3 border-b" style="border-color:var(--border);background:var(--surface-2)">
          <div class="grid grid-cols-3 gap-2">
            <label class="block text-xs font-bold uppercase tracking-wide col-span-1" style="color:var(--text-muted)">Table <span style="color:var(--danger)">*</span>
              <input id="cart-table" class="field mt-1 !py-1.5 !text-sm" placeholder="5" inputmode="numeric" value="${esc(cartTable)}" oninput="WT.setCartTable(this.value)">
            </label>
            <label class="block text-xs font-bold uppercase tracking-wide col-span-2" style="color:var(--text-muted)">Customer
              <input id="cart-customer" class="field mt-1 !py-1.5 !text-sm" placeholder="e.g. Maria Santos" value="${esc(cartCustomer)}" oninput="WT.setCartCustomer(this.value)">
            </label>
          </div>
        </div>` : ''}
      <div class="flex-1 overflow-auto p-5">
        ${cart.length ? cart.map(c => `
          <article class="pb-4 mb-4 border-b last:border-0" style="border-color:var(--border)">
            <div class="flex justify-between gap-3"><strong class="text-sm">${esc(c.name)}</strong><span class="text-sm font-semibold">${peso((Number(c.price) || 0) * c.qty)}</span></div>
            ${c.note ? `<p class="text-xs text-muted mt-1">Note: ${esc(c.note)}</p>` : ''}
            <div class="flex items-center gap-3 mt-3">
              <button class="w-8 h-8 rounded-full border font-bold" style="border-color:var(--border)" onclick="WT.cartQty('${c.lineId}',-1)">−</button>
              <strong class="text-sm w-6 text-center">${c.qty}</strong>
              <button class="w-8 h-8 rounded-full border font-bold" style="border-color:var(--border)" onclick="WT.cartQty('${c.lineId}',1)">+</button>
              <span class="ml-auto text-xs text-muted">${peso(c.price)} ea</span>
              <button class="text-xs font-bold" style="color:var(--danger)" onclick="WT.cartRemove('${c.lineId}')">Remove</button>
            </div>
          </article>`).join('') : `<div class="text-center py-16"><div class="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center" style="background:var(--surface-2);color:var(--text-muted)">${icon('shopping-bag','w-6 h-6')}</div><h3 class="font-bold mt-4">No items yet</h3><p class="text-sm text-muted mt-1">Tap a menu item to add it to this order.</p></div>`}
      </div>
      ${cart.length ? `
        <div class="p-5 border-t" style="border-color:var(--border)">
          <div class="flex justify-between text-sm mb-1"><span class="text-muted">Items</span><span>${count}</span></div>
          <div class="flex justify-between text-base font-bold mb-4"><span>Total</span><span>${peso(total)}</span></div>
          <button class="btn btn-primary w-full" onclick="WT.sendOrder()">${icon('send','w-4 h-4')} Send to kitchen</button>
          <p class="text-[11px] text-muted text-center mt-2">Table number is required.</p>
        </div>` : ''}
    </div>`;
    drawer.classList.add('show');
    if(window.lucide) lucide.createIcons();
  }
  function setCartTable(v){ cartTable = v; }
  function setCartCustomer(v){ cartCustomer = v; }
  function cartQty(lineId, n){
    const line = cart.find(c => c.lineId === lineId); if(!line) return;
    line.qty += n;
    if(line.qty < 1) cart = cart.filter(c => c.lineId !== lineId);
    openCart(); render();
  }
  function cartRemove(lineId){ cart = cart.filter(c => c.lineId !== lineId); openCart(); render(); }

  async function sendOrder(){
    if(!cart.length || busy) return;
    const table = String(cartTable || '').trim();
    if(!table){ S.toast('Enter a table number first.'); document.getElementById('cart-table')?.focus(); return; }
    const customer = String(cartCustomer || '').trim();
    busy = true;
    const items = cart.map(c => ({ name: c.name, qty: c.qty, note: c.note, price: c.price }));
    const total = cart.reduce((s, c) => s + ((Number(c.price) || 0) * (Number(c.qty) || 0)), 0);
    const order = await S.Data.createOrder({ items, staff: session.name || 'Waiter', total, table, customer });
    cart = []; cartTable = ''; cartCustomer = ''; busy = false;
    S.closeDrawer(); render();
    S.openModal(`
    <div class="p-9 text-center">
      <div class="w-20 h-20 rounded-full mx-auto flex items-center justify-center" style="background:var(--info);color:#fff">${icon('send','w-9 h-9')}</div>
      <p class="font-bold tracking-[.16em] text-xs mt-6" style="color:var(--info)">SENT TO KITCHEN · PENDING</p>
      <h2 class="font-serif text-3xl font-bold mt-2">${esc(order.code)}</h2>
      <div class="mt-3 flex justify-center">${tableTag(order)}</div>
      <p class="text-sm text-muted mt-3">Total: <strong>${peso(orderTotal(order))}</strong></p>
      <p class="text-sm text-muted mt-1">Waiting for the kitchen to accept. You'll get a notification each time a dish becomes ready.</p>
      <div class="flex gap-3 mt-6">
        <button class="btn btn-ghost flex-1" onclick="Savor.closeModal();Savor.navigate('orders')">View my orders</button>
        <button class="btn btn-primary flex-1" onclick="Savor.closeModal()">New order</button>
      </div>
    </div>`);
    if(S.state.sound) S.chime();
  }

  async function serveItem(orderId, itemIndex){
    const order = S.state.orders.find(o => o.id === orderId); if(!order) return;
    if(order.status !== 'READY'){ S.toast('Not ready yet.'); return; }
    const item = order.items[itemIndex]; if(!item || item.served) return;
    if(!item.ready){ S.toast('Item is still cooking.'); return; }
    await S.Data.serveItem(orderId, itemIndex);
    const updated = S.state.orders.find(o => o.id === orderId);
    if(updated && updated.status === 'COMPLETED'){
      S.toast(`${order.code} fully served ✓ · sent to cashier`, 4000, 'alert');
      if(S.state.sound) S.chime();
    } else {
      S.toast(`Served ${item.name} ✓`);
    }
    render();
  }
  async function serveAllReady(orderId){
    const order = S.state.orders.find(o => o.id === orderId); if(!order) return;
    if(order.status !== 'READY'){ S.toast('Not ready yet.'); return; }
    const ready = order.items.map((it, i) => ({ it, i })).filter(x => x.it.ready && !x.it.served);
    if(!ready.length){ S.toast('No items ready to serve.'); return; }
    for(const { i } of ready) await S.Data.serveItem(orderId, i);
    const updated = S.state.orders.find(o => o.id === orderId);
    if(updated && updated.status === 'COMPLETED'){
      S.toast(`${order.code} fully served ✓ · sent to cashier`, 4000, 'alert');
      if(S.state.sound) S.chime();
    } else {
      S.toast(`${ready.length} item${ready.length === 1 ? '' : 's'} served ✓`);
    }
    render();
  }

  window.WT = { setSearch, setFilter, toggleAvailable, openItemPicker, pickerQty, pickerAdd, openCart, setCartTable, setCartCustomer, cartQty, cartRemove, sendOrder, serveItem, serveAllReady };

  S.boot({ role: 'waiter', defaultScreen: 'menu', render });
})();
</script>
</body>
