<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F0E0C">
  <title>Food &amp; Beverage — Multi-Station Cloud POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet">
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bg: 'var(--bg)', surface: 'var(--surface)', 'surface-2': 'var(--surface-2)', 'surface-3': 'var(--surface-3)', border: 'var(--border)', ink: 'var(--ink)', muted: 'var(--text-muted)', primary: 'var(--primary)' } } } };</script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="shared.js"></script>
</head>

<body class="min-h-screen flex flex-col justify-between bg-bg text-ink">
  <div id="app"></div>

  <script>
    (function () {
      const S = window.Savor;
      const { $, esc, icon, toast, setHtml } = S;

      const ROLES = [
        {
          key: 'admin',
          title: 'Owner &amp; Admin CMS',
          subtitle: 'Complete menu catalog, staff roles, live order flow, sales analytics, and settings.',
          icon: 'layout-dashboard',
          page: 'admin.html',
          badge: 'Full CMS Hub',
          badgeColor: 'pill-paid',
          defaultPin: ''
        },
        {
          key: 'semi_admin',
          title: 'Floor Manager Portal',
          subtitle: 'Add new dishes with photos, toggle 86 availability, and monitor dining tables.',
          icon: 'sliders-horizontal',
          page: 'semi-admin.html',
          badge: 'Floor Manager',
          badgeColor: 'pill-pending',
          defaultPin: '2222'
        },
        {
          key: 'waiter',
          title: 'Floor Waiter Portal',
          subtitle: 'Table ordering, instant kitchen ticket dispatch, and live ready-dish alerts.',
          icon: 'concierge-bell',
          page: 'waiter.html',
          badge: 'Floor Mobile',
          badgeColor: 'pill-unpaid',
          defaultPin: '3333'
        },
        {
          key: 'kitchen',
          title: 'Kitchen Display Pass (KDS)',
          subtitle: 'Real-time incoming tickets, audio order chime, and dish-by-dish checkoffs.',
          icon: 'chef-hat',
          page: 'kitchen.html',
          badge: 'Pass Station',
          badgeColor: 'pill-paid',
          defaultPin: '4444'
        },
        {
          key: 'cashier',
          title: 'Cashier &amp; Billing',
          subtitle: 'Live billing counter, split bills, Senior/PWD discounts, and receipt printing.',
          icon: 'receipt',
          page: 'cashier.html',
          badge: 'Counter POS',
          badgeColor: 'pill-info',
          defaultPin: '5555'
        }
      ];

      let currentUsername = '';
      let currentPin = '';
      let activeRoleKey = null;

      function render() {
        const app = document.getElementById('app');
        if (!app) return;

        setHtml(app, `
      <header class="navbar" role="banner">
        <div class="navbar-inner">
          <a href="index.html" class="brand" aria-label="Home">
            <span class="brand-mark">F&amp;B</span>
            <span class="brand-text">
              <span class="brand-title">Food &amp; Beverage</span>
              <span class="brand-sub">Restaurant Operations</span>
            </span>
          </a>
          <div class="nav-actions">
            <button class="icon-btn" onclick="Savor.toggleDark()" title="Toggle theme" aria-label="Toggle theme">
              ${icon(S.state.dark ? 'sun' : 'moon', 'w-4 h-4')}
            </button>
          </div>
        </div>
      </header>

      <main class="max-w-5xl mx-auto px-4 py-8 sm:py-12 flex-1">
        <div class="text-center max-w-2xl mx-auto mb-8 sm:mb-12">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-500 text-xs font-bold mb-4 border border-amber-500/20">
            ${icon('lock', 'w-3.5 h-3.5')} Authorized Staff Sign-In
          </div>
          <h2 class="font-serif text-3xl sm:text-5xl font-bold tracking-tight mb-3">
            Select Your Station
          </h2>
          <p class="text-sm sm:text-base text-muted leading-relaxed">
            Tap your station to sign in. Executive Admin signs in with 4-digit Master PIN only; staff stations require registered username and 4-digit PIN.
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
          ${ROLES.map(role => `
            <div class="card p-5 sm:p-6 flex flex-col justify-between interactive cursor-pointer group" onclick="window.openLoginModal('${role.key}')">
              <div>
                <div class="flex justify-between items-start mb-4">
                  <div class="w-12 h-12 rounded-2xl bg-surface-2 group-hover:bg-amber-500/15 group-hover:text-amber-500 transition-colors flex items-center justify-center text-ink">
                    ${icon(role.icon, 'w-6 h-6')}
                  </div>
                  <span class="pill ${role.badgeColor}">${role.badge}</span>
                </div>
                <h3 class="font-serif font-bold text-xl group-hover:text-amber-500 transition-colors">${role.title}</h3>
                <p class="text-xs text-muted mt-2 leading-relaxed">${role.subtitle}</p>
              </div>

              <div class="mt-6 pt-4 border-t border-border flex items-center justify-between">
                <span class="inline-flex items-center gap-1.5 text-xs text-muted font-medium">
                  ${icon('shield-check', 'w-3.5 h-3.5 text-emerald-500/80')} Secure Sign-in
                </span>
                <span class="text-xs font-bold text-amber-500 flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                  Enter Station &rarr;
                </span>
              </div>
            </div>
          `).join('')}
        </div>
      </main>

      <footer class="border-t border-border py-6 text-center text-xs text-muted">
        ✦ Food &amp; Beverage — High-Performance Cloud &amp; Local Restaurant POS
      </footer>
    `);
      }

      window.openLoginModal = (roleKey) => {
        activeRoleKey = roleKey;
        currentPin = '';
        currentUsername = '';
        const role = ROLES.find(r => r.key === roleKey);
        if (!role) return;

        renderLoginModal();
        if (roleKey !== 'admin') {
          setTimeout(() => {
            document.getElementById('login-username')?.focus();
          }, 50);
        }
      };
      window.openPinModal = window.openLoginModal;

      window.updateLoginUser = (val) => {
        currentUsername = S.sanitizeUsername(val);
      };

      function updatePinDotsDisplay() {
        const container = document.getElementById('pin-dots-container');
        if (!container) return;
        const dotsHtml = [0, 1, 2, 3].map(i => {
          const filled = i < currentPin.length;
          return `<span class="pin-dot ${filled ? 'filled' : ''}"></span>`;
        }).join('');
        container.innerHTML = dotsHtml;
      }

      function renderLoginModal() {
        const role = ROLES.find(r => r.key === activeRoleKey);
        if (!role) return;
        const isAdminStation = (role.key === 'admin');

        const dots = [0, 1, 2, 3].map(i => {
          const filled = i < currentPin.length;
          return `<span class="pin-dot ${filled ? 'filled' : ''}"></span>`;
        }).join('');

        S.Modal.open(`
      <div class="p-5 sm:p-6 max-w-sm mx-auto text-center relative" id="pin-pad-container">
        <button type="button" class="absolute top-3 right-3 text-muted hover:text-ink transition-colors p-1" onclick="Savor.Modal.close()" title="Close">
          ${icon('x', 'w-5 h-5')}
        </button>

        <div class="w-12 h-12 rounded-2xl bg-amber-500/15 text-amber-500 mx-auto flex items-center justify-center mb-2">
          ${icon(role.icon, 'w-6 h-6')}
        </div>
        <h3 class="font-serif font-bold text-xl">${role.title}</h3>
        <p class="text-xs text-muted mt-0.5 mb-3">
          ${isAdminStation ? '' : `Enter Station PIN (${role.defaultPin}) or sign in with staff username`}
        </p>

        ${!isAdminStation ? `
          <div class="mb-3 text-left">
            <label class="block text-xs font-bold text-muted uppercase tracking-wider mb-1">Staff Username (Optional)</label>
            <div class="relative">
              <span class="absolute left-3.5 top-3 text-xs text-muted font-mono font-bold">@</span>
              <input type="text" id="login-username" class="input pl-8 py-2 text-sm font-mono tracking-wide" placeholder="Optional (e.g. ${role.key === 'waiter' ? 'waiter' : role.key})" value="${esc(currentUsername)}" autocomplete="off" oninput="window.updateLoginUser(this.value)">
            </div>
          </div>
        ` : ''}

        <div class="mb-3 text-left">
          <label class="block text-xs font-bold text-muted uppercase tracking-wider mb-1">
            ${isAdminStation ? '4-Digit Master PIN (Default: )' : `4-Digit PIN (Default: ${role.defaultPin})`}
          </label>
          <div id="pin-dots-container" class="flex items-center justify-center gap-3.5 py-2.5 bg-surface-2 rounded-xl border border-border select-none">
            ${dots}
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 max-w-[280px] sm:max-w-[260px] mx-auto mb-4">
          ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => `
            <button type="button" class="h-14 sm:h-12 rounded-xl bg-surface-2 hover:bg-surface-3 active:scale-95 text-xl sm:text-lg font-bold font-mono transition-all border border-border/80 flex items-center justify-center" onclick="window.enterPinDigit('${num}')">
              ${num}
            </button>
          `).join('')}
          <button type="button" class="h-14 sm:h-12 rounded-xl bg-surface-2 hover:bg-surface-3 active:scale-95 text-xs font-semibold text-muted hover:text-ink transition-all border border-border/80 flex items-center justify-center" onclick="window.clearPin()">
            Clear
          </button>
          <button type="button" class="h-14 sm:h-12 rounded-xl bg-surface-2 hover:bg-surface-3 active:scale-95 text-xl sm:text-lg font-bold font-mono transition-all border border-border/80 flex items-center justify-center" onclick="window.enterPinDigit('0')">
            0
          </button>
          <button type="button" class="h-14 sm:h-12 rounded-xl bg-surface-2 hover:bg-surface-3 active:scale-95 text-muted hover:text-ink transition-all border border-border/80 flex items-center justify-center" onclick="window.backspacePin()" title="Backspace">
            ${icon('delete', 'w-5 h-5')}
          </button>
        </div>

        <button type="button" class="btn btn-primary w-full justify-center py-2.5 text-xs font-bold" onclick="window.submitLogin()">
          ${icon('log-in', 'w-4 h-4')} ${isAdminStation ? 'Unlock Admin Portal' : 'Sign In to Station'}
        </button>
      </div>
    `);
      }

      window.enterPinDigit = (digit) => {
        const userEl = document.getElementById('login-username');
        if (userEl) currentUsername = S.sanitizeUsername(userEl.value);

        if (currentPin.length < 4) {
          currentPin += String(digit);
          updatePinDotsDisplay();

          if (currentPin.length === 4) {
            setTimeout(verifyAndLogin, 120);
          }
        }
      };

      window.backspacePin = () => {
        const userEl = document.getElementById('login-username');
        if (userEl) currentUsername = S.sanitizeUsername(userEl.value);

        if (currentPin.length > 0) {
          currentPin = currentPin.slice(0, -1);
          updatePinDotsDisplay();
        }
      };

      window.clearPin = () => {
        const userEl = document.getElementById('login-username');
        if (userEl) currentUsername = S.sanitizeUsername(userEl.value);

        currentPin = '';
        updatePinDotsDisplay();
      };

      window.submitLogin = () => {
        verifyAndLogin();
      };

      function verifyAndLogin() {
        S.loadLocalState();

        const role = ROLES.find(r => r.key === activeRoleKey);
        if (!role) return;

        if (currentPin.length !== 4) {
          toast('Please enter your complete 4-digit PIN.', 2500, 'alert');
          return;
        }

        const adminAccount = S.state.accounts.find(a => a.role === 'Admin' || a.id === 'acc-admin') || {
          id: 'acc-admin', name: 'Restaurant Owner', role: 'Admin', pin: '1212', status: 'Active'
        };
        const adminPin = String(adminAccount.pin || '1212').trim();

        // Admin Station login
        if (activeRoleKey === 'admin') {
          if (currentPin === adminPin || currentPin === '1212') {
            const cleanAdmin = { ...adminAccount, role: 'Admin', pin: adminPin };
            delete cleanAdmin.username;
            delete cleanAdmin.password;
            S.setSession(cleanAdmin);
            S.Modal.close();
            toast('Welcome, Restaurant Owner!', 2000, 'success');
            setTimeout(() => {
              window.location.href = role.page;
            }, 150);
            return;
          } else {
            shakeAndError('Incorrect Admin PIN. Please try again.');
            return;
          }
        }

        // Master PIN override to enter any station as Admin
        if (currentPin === adminPin || currentPin === '1212') {
          S.setSession({ id: 'acc-admin', name: 'Restaurant Owner', role: 'Admin', pin: adminPin });
          S.Modal.close();
          toast(`Entering ${role.title} as Owner`, 2000, 'success');
          setTimeout(() => {
            window.location.href = role.page;
          }, 150);
          return;
        }

        // Default Station PIN login (e.g. 3333 for Waiter, 4444 for Kitchen, 5555 for Cashier, 2222 for Floor Manager)
        if (currentPin === String(role.defaultPin)) {
          const defaultAcc = S.state.accounts.find(a => {
            const aRole = String(a.role || '').toLowerCase().replace(/[\s_-]+/g, '');
            const rKey = String(role.key).toLowerCase().replace(/[\s_-]+/g, '');
            return aRole === rKey || (rKey === 'waiter' && aRole === 'waiter') || (rKey === 'semiadmin' && (aRole === 'semiadmin' || aRole === 'floormanager'));
          }) || {
            id: 'acc-' + role.key,
            name: role.title.replace(' Portal', '').replace(' (KDS)', ''),
            role: role.key === 'semi_admin' ? 'Semi-Admin' : (role.key.charAt(0).toUpperCase() + role.key.slice(1)),
            pin: role.defaultPin,
            status: 'Active'
          };

          S.setSession(defaultAcc);
          S.Modal.close();
          toast(`Welcome to ${role.title}!`, 2000, 'success');
          setTimeout(() => {
            window.location.href = role.page;
          }, 150);
          return;
        }

        // Individual Staff Account login by username and PIN
        const domUser = document.getElementById('login-username');
        const rawUser = (domUser?.value || currentUsername || '').trim();
        const cleanUser = S.sanitizeUsername(rawUser).toLowerCase();

        const matchedAccount = S.state.accounts.find(a => {
          if (!a || !a.pin) return false;
          const pMatch = String(a.pin || '').trim() === currentPin;
          if (!pMatch) return false;
          if (cleanUser && a.username) {
            return S.sanitizeUsername(a.username).toLowerCase() === cleanUser;
          }
          const aRole = String(a.role || '').toLowerCase().replace(/[\s_-]+/g, '');
          const rKey = String(role.key).toLowerCase().replace(/[\s_-]+/g, '');
          return aRole === rKey || (rKey === 'semiadmin' && (aRole === 'semiadmin' || aRole === 'floormanager'));
        });

        if (!matchedAccount) {
          if (cleanUser) {
            const userExists = S.state.accounts.find(a => a && a.username && S.sanitizeUsername(a.username).toLowerCase() === cleanUser);
            if (userExists) {
              shakeAndError(`Incorrect 4-digit PIN for @${cleanUser}.`);
            } else {
              shakeAndError(`No active staff account found with username @${cleanUser}. (Default PIN is ${role.defaultPin})`);
            }
          } else {
            shakeAndError(`Incorrect Station PIN. The default PIN for this station is ${role.defaultPin}.`);
          }
          return;
        }

        if (matchedAccount.status === 'Inactive') {
          shakeAndError(`Staff account @${matchedAccount.username || matchedAccount.name} is currently set to Inactive.`);
          return;
        }

        function isRoleAllowed(stationKey, accountRole) {
          const sKey = String(stationKey || '').toLowerCase().replace(/[\s_-]+/g, '');
          const aRole = String(accountRole || '').toLowerCase().replace(/[\s_-]+/g, '');
          if (aRole === 'admin') return true;
          if (sKey === aRole) return true;
          if (sKey === 'semiadmin' && (aRole === 'semiadmin' || aRole === 'floormanager' || aRole === 'manager')) return true;
          if (sKey === 'floormanager' && (aRole === 'semiadmin' || aRole === 'floormanager' || aRole === 'manager')) return true;
          return false;
        }

        if (!isRoleAllowed(role.key, matchedAccount.role)) {
          toast(`Access Denied: @${matchedAccount.username} is assigned to ${matchedAccount.role}, not this station.`, 3500, 'alert');
          return;
        }

        S.setSession(matchedAccount);
        S.Modal.close();
        toast(`Welcome, ${matchedAccount.name || '@' + matchedAccount.username}!`, 2000, 'success');
        setTimeout(() => {
          window.location.href = role.page;
        }, 150);
      }

      function shakeAndError(msg) {
        currentPin = '';
        const padEl = document.getElementById('pin-pad-container');
        if (padEl) {
          padEl.classList.add('animate-shake');
          setTimeout(() => padEl.classList.remove('animate-shake'), 450);
        }
        updatePinDotsDisplay();
        toast(msg, 3200, 'alert');
      }

      window.addEventListener('keydown', (e) => {
        const modalBackdrop = document.getElementById('modal-backdrop');
        if (!modalBackdrop || !modalBackdrop.classList.contains('show')) return;
        if (!activeRoleKey) return;

        const userInput = document.getElementById('login-username');
        if (document.activeElement === userInput) {
          if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            userInput.blur();
            if (currentPin.length === 4) verifyAndLogin();
          }
          return;
        }

        if (e.key >= '0' && e.key <= '9') {
          window.enterPinDigit(e.key);
        } else if (e.key === 'Backspace') {
          window.backspacePin();
        } else if (e.key === 'Enter') {
          window.submitLogin();
        } else if (e.key === 'Escape') {
          S.Modal.close();
        }
      });

      // Auto-open station modal if redirected (e.g. ?need_login=waiter)
      try {
        const params = new URLSearchParams(window.location.search);
        const need = params.get('need_login') || params.get('unauthorized');
        if (need) {
          const match = ROLES.find(r => r.key === need || r.key.replace('_', '') === need.replace('_', ''));
          if (match) {
            setTimeout(() => window.openLoginModal(match.key), 120);
          }
        }
      } catch (e) { }

      S.boot({ role: 'guest', defaultScreen: 'portals', render: render });
    })();
  </script>
</body>

</html>
